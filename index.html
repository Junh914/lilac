<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; height: 100vh;
      background-color: #313338; color: #dbdee1;
      font-family: 'Noto Sans KR', sans-serif, system-ui;
      display: flex; justify-content: center; align-items: center;
      user-select: none;
      overflow: hidden;
    }

    ::-webkit-scrollbar { width: 9.5px; height: 9.5px; }
    ::-webkit-scrollbar-track { background: #2b2d31; border-radius: 5px; }
    ::-webkit-scrollbar-thumb { background: #80848e; border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: #b5bac1; }

    /* 로그인 화면 */
    #auth-container {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; height: 100vh; background-color: #313338;
      position: absolute; top: 0; left: 0; z-index: 10;
    }
    .auth-box {
      background-color: #2b2d31; padding: 32px; border-radius: 8px;
      width: 400px; display: flex; flex-direction: column; gap: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .auth-box h2 { color: #f2f3f5; margin: 0 0 8px 0; text-align: center; }
    .auth-input {
      background-color: #1e1f22; border: 1px solid #1e1f22; border-radius: 4px;
      padding: 10px 12px; color: #dbdee1; font-size: 14px; outline: none;
    }
    .auth-input:focus { border-color: #00a8fc; }
    .auth-btn {
      background-color: #5865f2; color: white; border: none; border-radius: 4px;
      padding: 10px; font-size: 16px; font-weight: 500; cursor: pointer;
      transition: background-color 0.2s;
    }
    .auth-btn:hover { background-color: #4752c4; }
    .auth-switch {
      text-align: center; font-size: 14px; color: #949ba4; cursor: pointer;
    }
    .auth-switch span { color: #00a8fc; text-decoration: underline; }

    /* 메인 앱 레이아웃 */
    #app-container {
      display: none;
      width: 100vw; height: 100vh;
      display: flex; flex-direction: row;
      overflow: hidden;
    }

    /* 사이드바 */
    #sidebar {
      background-color: #2b2d31;
      display: flex; flex-direction: column;
      flex-shrink: 0;
      min-width: 150px; max-width: 500px;
      position: relative;
    }
    .sidebar-header {
      padding: 16px; font-weight: bold; font-size: 16px; color: #f2f3f5;
      border-bottom: 1px solid #1f2023;
    }
    .channel-list {
      flex: 1; padding: 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px;
    }
    .channel-item {
      padding: 10px 12px; border-radius: 4px; cursor: pointer; color: #949ba4;
      font-weight: 500; transition: background 0.15s, color 0.15s;
    }
    .channel-item:hover { background-color: #35373c; color: #dbdee1; }
    .channel-item.active { background-color: #404249; color: #ffffff; }

    .user-profile {
      padding: 10px 12px; background-color: #232428; display: flex; align-items: center; justify-content: space-between;
    }
    .user-info { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #f2f3f5; }
    .user-actions { display: flex; gap: 6px; align-items: center; }
    .action-icon-btn { background: none; border: none; color: #949ba4; cursor: pointer; font-size: 16px; padding: 4px; }
    .action-icon-btn:hover { color: #f2f3f5; }
    .logout-btn { background: none; border: none; color: #949ba4; cursor: pointer; font-size: 13px; }
    .logout-btn:hover { color: #f23f43; }

    /* 리사이저 바 */
    #sidebar-resizer {
      width: 5px; background-color: #1e1f22; cursor: col-resize; flex-shrink: 0; transition: background-color 0.2s;
    }
    #sidebar-resizer:hover, #sidebar-resizer.resizing { background-color: #5865f2; }

    /* 메인 채팅 영역 */
    #chat-container {
      flex: 1; background-color: #313338; display: flex; flex-direction: column; min-width: 300px; position: relative;
    }
    .chat-header {
      height: 48px; padding: 0 16px; display: flex; align-items: center;
      font-weight: bold; border-bottom: 1px solid #1f2023; font-size: 16px; color: #f2f3f5;
    }
    .chat-messages {
      flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
    }

    /* Discord 스타일 날짜 변경선 디자인 */
    .date-divider {
      display: flex; align-items: center; text-align: center;
      color: #949ba4; font-size: 12px; font-weight: 600;
      margin: 24px 0; width: 100%; position: relative;
    }
    .date-divider::before {
      content: ''; position: absolute; left: 0; right: 0; top: 50%;
      border-top: 1px solid #3f4147; z-index: 1;
    }
    .date-divider span {
      background-color: #313338; padding: 0 12px;
      position: relative; z-index: 2; margin: 0 auto;
      border-radius: 8px;
    }
    
    /* 메시지 정렬 및 기본 스타일 */
    .message-row { display: flex; gap: 16px; width: 100%; margin-top: 4px; }
    .message-row.is-me { flex-direction: row-reverse; text-align: right; }
    .message-row.is-me .message-content { align-items: flex-end; }
    .message-row.is-me .message-header { flex-direction: row-reverse; }
    
    .message-row .message-bubble { background-color: transparent; color: #dbdee1; padding: 0; border-radius: 0; }
    .message-row.is-me .message-bubble { background-color: transparent; color: #dbdee1; }

    .message-avatar { width: 40px; height: 40px; border-radius: 50%; background-color: #5865f2; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; flex-shrink: 0; overflow: hidden; }
    .message-avatar img { width: 100%; height: 100%; object-fit: cover; }
    
    .message-content { display: flex; flex-direction: column; gap: 4px; flex: 1; max-width: 70%; }
    .message-header { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .message-header .username { font-weight: 600; color: #f2f3f5; }
    .message-header .timestamp { font-size: 12px; color: #949ba4; }
    
    .bubble-wrapper { display: flex; align-items: flex-end; gap: 8px; width: fit-content; margin-top: 2px; }
    .message-row.is-me .bubble-wrapper { flex-direction: row-reverse; }
    
    .message-bubble { font-size: 14px; color: #dbdee1; line-height: 1.4; word-break: break-all; }
    .timestamp-inline { font-size: 11px; color: #949ba4; white-space: nowrap; }

    /* 입력창 영역 */
    .chat-input-area { padding: 0 16px 24px 16px; }
    .chat-input-wrapper {
      background-color: #383a40; border-radius: 8px; padding: 10px 16px; display: flex; align-items: center;
    }
    .chat-input {
      width: 100%; background: none; border: none; outline: none; color: #dbdee1; font-size: 14px; font-family: inherit;
    }

    /* 설정 모달창 스타일 */
    #settings-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.7); z-index: 100; justify-content: center; align-items: center;
    }
    .modal-box {
      background-color: #313338; padding: 24px; border-radius: 8px; width: 400px;
      display: flex; flex-direction: column; gap: 16px; color: #dbdee1; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .modal-box h3 { margin: 0 0 8px 0; color: #f2f3f5; text-align: center; }
    .modal-group { display: flex; flex-direction: column; gap: 6px; }
    .modal-group label { font-size: 12px; font-weight: bold; color: #949ba4; }
    .modal-buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
    .modal-btn-cancel { background-color: #4e5058; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    .modal-btn-save { background-color: #5865f2; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
    .modal-btn-save:hover { background-color: #4752c4; }
  </style>
</head>
<body>

  <div id="auth-container">
    <div class="auth-box">
      <h2 id="auth-title">로그인</h2>
      <input type="email" id="auth-email" class="auth-input" placeholder="이메일">
      <input type="password" id="auth-password" class="auth-input" placeholder="비밀번호">
      <button id="auth-action-btn" class="auth-btn">로그인</button>
      <div id="auth-switch-text" class="auth-switch">계정이 없으신가요? <span>회원가입하기</span></div>
    </div>
  </div>

  <div id="settings-modal">
    <div class="modal-box">
      <h3>사용자 설정</h3>
      <div class="modal-group">
        <label>프로필 사진 (아이콘 설정)</label>
        <input type="file" id="settings-avatar-input" accept="image/*" style="font-size: 12px; color: #dbdee1;">
      </div>
      <div class="modal-group">
        <label>닉네임</label>
        <input type="text" id="settings-nickname-input" class="auth-input" placeholder="새 닉네임 입력">
      </div>
      <div class="modal-group">
        <label>새 비밀번호 (변경시에만 입력)</label>
        <input type="password" id="settings-password-input" class="auth-input" placeholder="변경할 비밀번호">
      </div>
      <div class="modal-buttons">
        <button class="modal-btn-cancel" id="settings-cancel-btn">취소</button>
        <button class="modal-btn-save" id="settings-save-btn">저장</button>
      </div>
    </div>
  </div>

  <div id="app-container">
    <div id="sidebar">
      <div class="sidebar-header">채널 목록</div>
      <div class="channel-list" id="channel-list">
        <div class="channel-item active" data-channel="general"># general</div>
        <div class="channel-item" data-channel="random"># random</div>
      </div>
      <div class="user-profile">
        <div class="user-info">
          <div id="user-avatar-preview" style="width: 32px; height: 32px; border-radius: 50%; background-color: #5865f2; overflow: hidden; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white;">U</div>
          <span id="user-display-name">유저</span>
        </div>
        <div class="user-actions">
          <button class="action-icon-btn" id="open-settings-btn" title="설정">⚙️</button>
          <button class="logout-btn" id="logout-btn">로그아웃</button>
        </div>
      </div>
    </div>

    <div id="sidebar-resizer"></div>

    <div id="chat-container">
      <div class="chat-header" id="current-channel-title"># general</div>
      <div class="chat-messages" id="messages"></div>
      <div class="chat-input-area">
        <div class="chat-input-wrapper">
          <input type="text" id="message-input" class="chat-input" placeholder="#general에 메시지 보내기">
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile, updatePassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDRGQYScMifqnzBGvN8UfVx_mmHJL4MhPg",
      authDomain: "lilac-13935.firebaseapp.com",
      projectId: "lilac-13935",
      storageBucket: "lilac-13935.firebasestorage.app",
      messagingSenderId: "485552650048",
      appId: "1:485552650048:web:d05c5dd6ce989765a5aca5",
      measurementId: "G-81H89P6F6E"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const socket = io();

    let currentUser = null;
    let currentChannel = 'general';
    let lastDate = null;

    // 1. 초기 6.4 : 30 너비 비율 적용
    window.addEventListener('DOMContentLoaded', () => {
      const sidebar = document.getElementById('sidebar');
      const totalWidth = window.innerWidth;
      const initialSidebarWidth = totalWidth * (6.4 / 36.4);
      if (sidebar) {
        sidebar.style.width = Math.max(150, Math.min(initialSidebarWidth, 400)) + 'px';
      }
    });

    // 2. 사이드바 리사이저 드래그 기능 구현
    const resizer = document.getElementById('sidebar-resizer');
    const sidebar = document.getElementById('sidebar');
    let isResizing = false;

    if (resizer && sidebar) {
      resizer.addEventListener('mousedown', (e) => {
        isResizing = true;
        resizer.classList.add('resizing');
        document.body.style.cursor = 'col-resize';
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        let newWidth = e.clientX;
        if (newWidth < 150) newWidth = 150;
        if (newWidth > 500) newWidth = 500;
        sidebar.style.width = newWidth + 'px';
      });

      document.addEventListener('mouseup', () => {
        if (isResizing) {
          isResizing = false;
          resizer.classList.remove('resizing');
          document.body.style.cursor = 'default';
        }
      });
    }

    // 3. 인증 상태 관리
    onAuthStateChanged(auth, (user) => {
      const authContainer = document.getElementById('auth-container');
      const appContainer = document.getElementById('app-container');

      if (user) {
        currentUser = user;
        if (authContainer) authContainer.style.display = 'none';
        if (appContainer) appContainer.style.display = 'flex';
        
        updateUserUI(user);
        socket.emit('join channel', currentChannel);
      } else {
        currentUser = null;
        if (authContainer) authContainer.style.display = 'flex';
        if (appContainer) appContainer.style.display = 'none';
      }
    });

    function updateUserUI(user) {
      const displayNameElem = document.getElementById('user-display-name');
      const avatarPreview = document.getElementById('user-avatar-preview');
      const nicknameInput = document.getElementById('settings-nickname-input');
      
      const name = user.displayName || (user.email ? user.email.split('@')[0] : '유저');
      if (displayNameElem) displayNameElem.innerText = name;
      if (nicknameInput) nicknameInput.value = name;

      if (avatarPreview) {
        avatarPreview.innerHTML = '';
        if (user.photoURL) {
          const img = document.createElement('img');
          img.src = user.photoURL;
          img.style.width = '100%';
          img.style.height = '100%';
          img.style.objectFit = 'cover';
          avatarPreview.appendChild(img);
        } else {
          avatarPreview.innerText = name[0].toUpperCase();
        }
      }
    }

    // 4. 로그인 / 회원가입 화면 토글
    let isSignupMode = false;
    const authTitle = document.getElementById('auth-title');
    const authActionBtn = document.getElementById('auth-action-btn');
    const authSwitchText = document.getElementById('auth-switch-text');

    if (authSwitchText) {
      authSwitchText.addEventListener('click', () => {
        isSignupMode = !isSignupMode;
        if (authTitle) authTitle.innerText = isSignupMode ? '회원가입' : '로그인';
        if (authActionBtn) authActionBtn.innerText = isSignupMode ? '가입하기' : '로그인';
        authSwitchText.innerHTML = isSignupMode ? '이미 계정이 있으신가요? <span>로그인하기</span>' : '계정이 없으신가요? <span>회원가입하기</span>';
      });
    }

    if (authActionBtn) {
      authActionBtn.addEventListener('click', async () => {
        const emailInput = document.getElementById('auth-email');
        const passwordInput = document.getElementById('auth-password');
        
        const email = emailInput ? emailInput.value.trim() : '';
        const password = passwordInput ? passwordInput.value.trim() : '';

        if (!email || !password) {
          alert('이메일과 비밀번호를 모두 입력해주세요.');
          return;
        }

        try {
          if (isSignupMode) {
            await createUserWithEmailAndPassword(auth, email, password);
          } else {
            await signInWithEmailAndPassword(auth, email, password);
          }
        } catch (error) {
          alert('인증 실패: ' + error.message);
        }
      });
    }

    // 5. 로그아웃 버튼
    const logoutBtn = document.getElementById('logout-btn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', () => {
        signOut(auth);
      });
    }

    // 6. 설정 모달창 열기/닫기 및 정보 수정 기능
    const settingsModal = document.getElementById('settings-modal');
    const openSettingsBtn = document.getElementById('open-settings-btn');
    const settingsCancelBtn = document.getElementById('settings-cancel-btn');
    const settingsSaveBtn = document.getElementById('settings-save-btn');

    if (openSettingsBtn) {
      openSettingsBtn.addEventListener('click', () => {
        if (settingsModal) settingsModal.style.display = 'flex';
      });
    }

    if (settingsCancelBtn) {
      settingsCancelBtn.addEventListener('click', () => {
        if (settingsModal) settingsModal.style.display = 'none';
      });
    }

    if (settingsSaveBtn) {
      settingsSaveBtn.addEventListener('click', async () => {
        if (!auth.currentUser) return;
        const newNickname = document.getElementById('settings-nickname-input').value.trim();
        const newPassword = document.getElementById('settings-password-input').value.trim();
        const avatarFileInput = document.getElementById('settings-avatar-input');

        try {
          let photoURL = auth.currentUser.photoURL;

          if (avatarFileInput && avatarFileInput.files && avatarFileInput.files[0]) {
            const file = avatarFileInput.files[0];
            photoURL = await new Promise((resolve) => {
              const reader = new FileReader();
              reader.onload = (e) => resolve(e.target.result);
              reader.readAsDataURL(file);
            });
          }

          await updateProfile(auth.currentUser, {
            displayName: newNickname || auth.currentUser.displayName,
            photoURL: photoURL
          });

          if (newPassword) {
            await updatePassword(auth.currentUser, newPassword);
          }

          alert('설정이 성공적으로 저장되었습니다.');
          updateUserUI(auth.currentUser);
          if (settingsModal) settingsModal.style.display = 'none';
          document.getElementById('settings-password-input').value = '';
        } catch (error) {
          alert('설정 저장 실패: ' + error.message);
        }
      });
    }

    // 7. 채널 이동 및 실시간 채팅 소켓 이벤트
    document.querySelectorAll('.channel-item').forEach(item => {
      item.addEventListener('click', (e) => {
        document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
        e.target.classList.add('active');
        currentChannel = e.target.getAttribute('data-channel');
        
        const channelTitle = document.getElementById('current-channel-title');
        if (channelTitle) channelTitle.innerText = `# ${currentChannel}`;
        
        const messagesDiv = document.getElementById('messages');
        if (messagesDiv) messagesDiv.innerHTML = '';
        lastDate = null;
        
        socket.emit('join channel', currentChannel);
      });
    });

    socket.on('chat history', (data) => {
      const messagesDiv = document.getElementById('messages');
      if (messagesDiv && data.history) {
        messagesDiv.innerHTML = '';
        lastDate = null;
        data.history.forEach(msg => appendMessage(msg));
      }
    });

    socket.on('chat message', (msg) => {
      if (msg.channel === currentChannel) {
        appendMessage(msg);
      }
    });

    // 메시지 입력 전송 (오전/오후 12시간제 시각 적용)
    const messageInput = document.getElementById('message-input');
    if (messageInput) {
      messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && messageInput.value.trim() !== '') {
          if (!currentUser) return;
          const text = messageInput.value;
          const now = new Date();
          
          let hours = now.getHours();
          const minutes = now.getMinutes().toString().padStart(2, '0');
          const ampm = hours >= 12 ? '오후' : '오전';
          hours = hours % 12;
          hours = hours ? hours : 12; // 0시는 12시로 표시
          
          const timeStr = `${ampm} ${hours}:${minutes}`;
          const dateStr = now.toLocaleDateString();
          
          const nickname = currentUser.displayName || (currentUser.email ? currentUser.email.split('@')[0] : '유저');
          
          socket.emit('chat message', {
            channel: currentChannel,
            uid: currentUser.uid,
            nickname: nickname,
            photoURL: currentUser.photoURL || null,
            text: text,
            date: dateStr,
            time: timeStr
          });
          messageInput.value = '';
        }
      });
    }

    // 메시지 렌더링 및 그룹화 함수
    function appendMessage(msg) {
      const messagesDiv = document.getElementById('messages');
      if (!messagesDiv) return;

      if (msg.date && msg.date !== lastDate) {
        lastDate = msg.date;
        const divider = document.createElement('div');
        divider.className = 'date-divider';
        const span = document.createElement('span');
        span.innerText = msg.date;
        divider.appendChild(span);
        messagesDiv.appendChild(divider);
      }

      const isMe = currentUser && msg.uid === currentUser.uid;
      const lastRow = messagesDiv.lastElementChild;

      if (lastRow && lastRow.classList.contains('message-row') && 
          lastRow.dataset.uid === msg.uid && 
          lastRow.dataset.time === msg.time && 
          lastRow.dataset.isMe === (isMe ? 'true' : 'false')) {
        
        const content = lastRow.querySelector('.message-content');
        if (content) {
          const oldTimestamp = content.querySelector('.timestamp-inline');
          if (oldTimestamp) oldTimestamp.remove();

          const bubbleWrapper = document.createElement('div');
          bubbleWrapper.className = 'bubble-wrapper';

          const bubble = document.createElement('div');
          bubble.className = 'message-bubble';
          bubble.innerText = msg.text || '';
          bubbleWrapper.appendChild(bubble);

          const timestamp = document.createElement('span');
          timestamp.className = 'timestamp timestamp-inline';
          timestamp.innerText = msg.time || '';
          bubbleWrapper.appendChild(timestamp);

          content.appendChild(bubbleWrapper);
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
          return;
        }
      }

      const row = document.createElement('div');
      row.className = `message-row ${isMe ? 'is-me' : ''}`;
      row.dataset.uid = msg.uid;
      row.dataset.time = msg.time;
      row.dataset.isMe = isMe ? 'true' : 'false';

      if (!isMe) {
        const avatar = document.createElement('div');
        avatar.className = 'message-avatar';
        if (msg.photoURL) {
          const img = document.createElement('img');
          img.src = msg.photoURL;
          avatar.appendChild(img);
        } else {
          avatar.innerText = msg.nickname ? msg.nickname[0].toUpperCase() : 'U';
        }
        row.appendChild(avatar);
      }

      const content = document.createElement('div');
      content.className = 'message-content';

      const header = document.createElement('div');
      header.className = 'message-header';
      
      const username = document.createElement('span');
      username.className = 'username';
      username.innerText = msg.nickname || '익명';
      header.appendChild(username);

      content.appendChild(header);

      const bubbleWrapper = document.createElement('div');
      bubbleWrapper.className = 'bubble-wrapper';

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.innerText = msg.text || '';
      bubbleWrapper.appendChild(bubble);

      const timestamp = document.createElement('span');
      timestamp.className = 'timestamp timestamp-inline';
      timestamp.innerText = msg.time || '';
      bubbleWrapper.appendChild(timestamp);

      content.appendChild(bubbleWrapper);
      row.appendChild(content);
      messagesDiv.appendChild(row);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
  </script>
</body>
</html>
