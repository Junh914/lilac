<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; height: 100vh;
      background-color: #313338; color: #dbdee1;
      font-family: 'Noto Sans KR', sans-serif, system-ui;
      display: flex; justify-content: center; align-items: center;
      user-select: none; overflow: hidden;
    }

    ::-webkit-scrollbar { width: 9.5px; height: 9.5px; }
    ::-webkit-scrollbar-track { background: #2b2d31; border-radius: 5px; }
    ::-webkit-scrollbar-thumb { background: #80848e; border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: #b5bac1; }

    #auth-container {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; height: 100vh; background-color: #313338;
    }
    .auth-box {
      background-color: #2b2d31; padding: 30px; border-radius: 8px;
      width: 350px; display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: center;
    }
    .auth-box h2 { color: #f2f3f5; margin-top: 0; margin-bottom: 5px; }
    .auth-box input {
      padding: 10px; border-radius: 4px; border: 1px solid #1e1f22;
      background-color: #1e1f22; color: #dbdee1; font-size: 14px; outline: none;
    }
    .auth-box button#auth-action-btn {
      padding: 10px; border-radius: 4px; border: none; margin-top: 5px;
      background-color: #5865f2; color: white; font-weight: bold; cursor: pointer; font-size: 14px;
    }
    .auth-box button#auth-action-btn:hover { background-color: #4752c4; }
    .toggle-link-text {
      color: #949ba4; font-size: 11px; cursor: pointer; text-decoration: underline; margin-top: 6px;
    }
    .toggle-link-text:hover { color: #00a8fc; }

    #chat-container {
      display: none; width: 100%; height: 100vh; background-color: #313338; flex-direction: row;
    }

    /* 사이드바 및 리사이저 */
    .sidebar {
      width: 240px; min-width: 180px; max-width: 400px;
      background-color: #2b2d31; display: flex; flex-direction: column;
      border-right: 1px solid #1f2023; position: relative; flex-shrink: 0;
    }
    .sidebar-resizer {
      width: 6px; height: 100%; position: absolute; right: -3px; top: 0;
      cursor: ew-resize; z-index: 10; background-color: transparent;
    }
    .sidebar-resizer:hover::after, .sidebar-resizer.resizing::after {
      content: ''; position: absolute; left: 2px; top: 0; width: 2px; height: 100%;
      background-color: #5865f2;
    }

    .sidebar-header {
      height: 48px; padding: 0 16px; display: flex; align-items: center;
      font-weight: bold; color: #ffffff; border-bottom: 2px solid #1f2023;
    }
    .channel-list { padding: 8px; flex: 1; overflow-y: auto; }
    .channel-item {
      padding: 8px 10px; border-radius: 4px; cursor: pointer; color: #949ba4;
      font-weight: 500; font-size: 14px; margin-bottom: 2px;
    }
    .channel-item:hover { background-color: #35373c; color: #dbdee1; }
    .channel-item.active { background-color: #404249; color: #ffffff; }

    .user-panel {
      height: 55px; background-color: #232428; display: flex; align-items: center;
      padding: 0 8px; gap: 8px; border-top: 1px solid #1f2023;
    }
    .user-profile-info {
      display: flex; align-items: center; gap: 8px; overflow: hidden; cursor: pointer; flex: 1; min-width: 0;
    }
    .user-avatar-small {
      width: 36px; height: 36px; border-radius: 50%; background-color: #5865f2;
      display: flex; align-items: center; justify-content: center; font-weight: bold; color: white;
      font-size: 14px; overflow: hidden; flex-shrink: 0;
    }
    .user-avatar-small img { width: 100%; height: 100%; object-fit: cover; }
    .user-name-tag { display: flex; flex-direction: column; min-width: 0; flex: 1; }
    .user-display-name { font-weight: bold; font-size: 13px; color: #f2f3f5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-status { font-size: 11px; color: #949ba4; }

    .settings-icon-btn {
      background: transparent; border: none; cursor: pointer; padding: 6px; border-radius: 4px;
      display: flex; align-items: center; justify-content: center; color: #b5bac1;
    }
    .settings-icon-btn:hover { background-color: #35373c; color: #dbdee1; }
    .settings-icon-btn img { width: 18px; height: 18px; filter: invert(0.8); }

    /* 채팅 영역 */
    .chat-area { flex: 1; display: flex; flex-direction: column; background-color: #313338; min-width: 0; }
    .chat-header {
      height: 48px; padding: 0 16px; display: flex; align-items: center;
      font-weight: bold; color: #ffffff; border-bottom: 2px solid #1f2023;
      background-color: #313338; box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    .messages-container {
      flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px;
    }
    
    /* 호버 메시지 디자인 개선 (디스코드 스타일) */
    .message-row {
      display: flex; gap: 16px; width: 100%; margin-top: 10px; padding: 4px 8px; border-radius: 4px; transition: background-color 0.1s;
    }
    .message-row:hover {
      background-color: #2e3035;
    }

    .message-avatar {
      width: 40px; height: 40px; border-radius: 50%; background-color: #5865f2;
      display: flex; align-items: center; justify-content: center; font-weight: bold; color: white;
      font-size: 16px; overflow: hidden; flex-shrink: 0;
    }
    .message-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .time-container { display: flex; align-items: flex-end; width: 100%; gap: 16px; }
    .timestamp { font-size: 10px; color: #949ba4; margin-bottom: 2px; white-space: nowrap; }
    .message-content { display: flex; flex-direction: column; flex: 1; min-width: 0; }
    .message-header { font-weight: bold; color: #ffffff; font-size: 14px; margin-bottom: 4px; }
    .message-bubble { color: #dbdee1; font-size: 14px; word-break: break-all; line-height: 1.4; }

    #message-form { padding: 20px; background-color: #313338; display: flex; gap: 10px; }
    #message-input {
      flex: 1; padding: 12px; border-radius: 8px; border: none;
      background-color: #383a40; color: #dbdee1; font-size: 14px; outline: none;
    }
    #send-btn {
      padding: 0 20px; background-color: #5865f2; color: white; border: none;
      border-radius: 8px; font-weight: bold; cursor: pointer;
    }
    #send-btn:hover { background-color: #4752c4; }

    /* 설정 모달 스타일 */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background-color: #313338; width: 450px; border-radius: 8px; padding: 24px;
      display: flex; flex-direction: column; gap: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .modal-box h3 { color: #f2f3f5; margin: 0; }
    .modal-box input {
      padding: 10px; border-radius: 4px; border: 1px solid #1e1f22;
      background-color: #1e1f22; color: #dbdee1; font-size: 14px; outline: none;
    }
    .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px; }
    .modal-buttons button {
      padding: 8px 16px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; font-size: 14px;
    }
    .btn-cancel { background-color: transparent; color: #ffffff; }
    .btn-cancel:hover { text-decoration: underline; }
    .btn-save { background-color: #5865f2; color: white; }
    .btn-save:hover { background-color: #4752c4; }
  </style>
</head>
<body>

  <div id="auth-container">
    <div class="auth-box">
      <h2 id="auth-title">로그인</h2>
      <input type="text" id="auth-id" placeholder="아이디">
      <input type="password" id="auth-password" placeholder="비밀번호">
      <input type="text" id="auth-nickname" placeholder="닉네임 (회원가입 전용)" style="display: none;">
      <button id="auth-action-btn">로그인</button>
      <span class="toggle-link-text" id="auth-toggle-link">계정이 없으신가요? 회원가입하기</span>
    </div>
  </div>

  <div id="chat-container">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">Lilac</div>
      <div class="channel-list">
        <div class="channel-item active" data-channel="general"># 자유채팅방</div>
      </div>
      <div class="user-panel">
        <div class="user-profile-info" id="open-settings-btn2">
          <div class="user-avatar-small" id="sidebar-avatar">유</div>
          <div class="user-name-tag">
            <span class="user-display-name" id="sidebar-nickname">닉네임</span>
            <span class="user-status">온라인</span>
          </div>
        </div>
        <button class="settings-icon-btn" id="open-settings-btn" title="설정">
          <img src="setting-icon.jpg" alt="설정">
        </button>
      </div>
      <div class="sidebar-resizer" id="sidebar-resizer"></div>
    </div>

    <div class="chat-area">
      <div class="chat-header"><span id="current-channel-name"># 자유채팅방</span></div>
      <div class="messages-container" id="messages"></div>
      <form id="message-form">
        <input type="text" id="message-input" placeholder="#자유채팅방에 메시지 보내기" autocomplete="off">
        <button type="submit" id="send-btn">전송</button>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="settings-modal">
    <div class="modal-box">
      <h3>사용자 설정</h3>
      <label style="font-size:12px; color:#b5bac1;">닉네임 변경</label>
      <input type="text" id="setting-nickname-input">
      <label style="font-size:12px; color:#b5bac1;">비밀번호 변경</label>
      <input type="password" id="setting-password-input" placeholder="새 비밀번호 입력">
      <div class="modal-buttons">
        <button class="btn-cancel" id="settings-cancel-btn">취소</button>
        <button class="btn-save" id="settings-save-btn">저장</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    let currentUser = null;
    let currentChannel = 'general';
    let unreadOtherMessages = 0; // 타인이 보낸 메시지 누적 카운트

    const authContainer = document.getElementById('auth-container');
    const chatContainer = document.getElementById('chat-container');
    const authTitle = document.getElementById('auth-title');
    const authIdInput = document.getElementById('auth-id');
    const authPasswordInput = document.getElementById('auth-password');
    const authNicknameInput = document.getElementById('auth-nickname');
    const authActionBtn = document.getElementById('auth-action-btn');
    const authToggleLink = document.getElementById('auth-toggle-link');

    const messages = document.getElementById('messages');
    const messageForm = document.getElementById('message-form');
    const messageInput = document.getElementById('message-input');
    
    const sidebarNickname = document.getElementById('sidebar-nickname');
    const sidebarAvatar = document.getElementById('sidebar-avatar');

    const settingsModal = document.getElementById('settings-modal');
    const openSettingsBtn = document.getElementById('open-settings-btn');
    const openSettingsBtn2 = document.getElementById('open-settings-btn2');
    const settingsCancelBtn = document.getElementById('settings-cancel-btn');
    const settingsSaveBtn = document.getElementById('settings-save-btn');
    const settingNicknameInput = document.getElementById('setting-nickname-input');

    // 1. 사이드바 리사이저 드래그 조절 기능
    const sidebar = document.getElementById('sidebar');
    const resizer = document.getElementById('sidebar-resizer');
    let isResizing = false;

    resizer.addEventListener('mousedown', (e) => {
      isResizing = true;
      resizer.classList.add('resizing');
      document.body.style.cursor = 'ew-resize';
    });

    window.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      let newWidth = e.clientX;
      if (newWidth < 180) newWidth = 180;
      if (newWidth > 450) newWidth = 450;
      sidebar.style.width = newWidth + 'px';
    });

    window.addEventListener('mouseup', () => {
      if (isResizing) {
        isResizing = false;
        resizer.classList.remove('resizing');
        document.body.style.cursor = 'default';
      }
    });

    // 2. 창 포커스 시 브라우저 타이틀 카운트 초기화
    window.addEventListener('focus', () => {
      unreadOtherMessages = 0;
      updateDocumentTitle();
    });

    function updateDocumentTitle() {
      if (unreadOtherMessages > 0) {
        document.title = `(${unreadOtherMessages}) Chat`;
      } else {
        document.title = 'Chat';
      }
    }

    let isRegisterMode = false;

    authToggleLink.addEventListener('click', () => {
      isRegisterMode = !isRegisterMode;
      if (isRegisterMode) {
        authTitle.innerText = '회원가입';
        authNicknameInput.style.display = 'block';
        authActionBtn.innerText = '가입하기';
        authToggleLink.innerText = '이미 계정이 있으신가요? 로그인하기';
      } else {
        authTitle.innerText = '로그인';
        authNicknameInput.style.display = 'none';
        authActionBtn.innerText = '로그인';
        authToggleLink.innerText = '계정이 없으신가요? 회원가입하기';
      }
    });

    authActionBtn.addEventListener('click', () => {
      const id = authIdInput.value.trim();
      const pwd = authPasswordInput.value.trim();
      const nickname = authNicknameInput.value.trim() || id;

      if (!id || !pwd) {
        alert('아이디와 비밀번호를 입력해주세요.');
        return;
      }

      currentUser = {
        uid: id,
        nickname: nickname,
        displayName: nickname
      };

      authContainer.style.display = 'none';
      chatContainer.style.display = 'flex';

      sidebarNickname.innerText = currentUser.displayName;
      sidebarAvatar.innerText = currentUser.displayName[0].toUpperCase();

      socket.emit('join channel', currentChannel);
    });

    function openSettings() {
      if (!currentUser) return;
      settingNicknameInput.value = currentUser.displayName;
      settingsModal.classList.add('show');
    }
    function closeSettings() {
      settingsModal.classList.remove('show');
    }
    openSettingsBtn.addEventListener('click', openSettings);
    openSettingsBtn2.addEventListener('click', openSettings);
    settingsCancelBtn.addEventListener('click', closeSettings);

    settingsSaveBtn.addEventListener('click', () => {
      const newName = settingNicknameInput.value.trim();
      if (newName) {
        currentUser.displayName = newName;
        sidebarNickname.innerText = newName;
        sidebarAvatar.innerText = newName[0].toUpperCase();
      }
      closeSettings();
    });

    socket.on('chat history', (data) => {
      messages.innerHTML = '';
      if (data.history && Array.isArray(data.history)) {
        data.history.forEach((msg) => {
          appendMessage(msg, false);
        });
      }
      messages.scrollTop = messages.scrollHeight;
    });

    socket.on('chat message', (msg) => {
      const isMine = currentUser && msg.uid === currentUser.uid;
      // 타인이 보낸 메시지인 경우 카운트 증가 및 타이틀 반영
      if (!isMine) {
        unreadOtherMessages++;
        updateDocumentTitle();
      }
      appendMessage(msg, true);
    });

    messageForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text || !currentUser) return;

      const now = new Date();
      const dateStr = now.toLocaleDateString('ko-KR');
      const timeStr = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

      const messageData = {
        channel: currentChannel,
        uid: currentUser.uid,
        nickname: currentUser.displayName,
        text: text,
        date: dateStr,
        time: timeStr
      };

      socket.emit('chat message', messageData);
      messageInput.value = '';
    });

    function appendMessage(msg, scrollDown = true) {
      const row = document.createElement('div');
      row.className = 'message-row'; // 호버 시 배경색이 은은하게 바뀌도록 스타일 적용

      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.innerText = (msg.nickname ? msg.nickname[0] : '유').toUpperCase();
      row.appendChild(avatar);

      const timeContainer = document.createElement('div');
      timeContainer.className = 'time-container';

      const content = document.createElement('div');
      content.className = 'message-content';

      const header = document.createElement('div');
      header.className = 'message-header';
      header.innerText = msg.nickname || '익명';
      content.appendChild(header);

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.innerText = msg.text;
      content.appendChild(bubble);

      const timeDiv = document.createElement('div');
      timeDiv.className = 'timestamp';
      timeDiv.innerText = msg.time || '';

      timeContainer.appendChild(content);
      timeContainer.appendChild(timeDiv);

      row.appendChild(timeContainer);
      messages.appendChild(row);

      if (scrollDown) {
        messages.scrollTop = messages.scrollHeight;
      }
    }
  </script>
</body>
</html>
