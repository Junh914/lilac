<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미니 디스코드 채팅방</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  
  <script src="/socket.io/socket.io.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', sans-serif;
    }

    body {
      background-color: #313338;
      color: #dbdee1;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* --- 로그인 / 회원가입 창 --- */
    #auth-container {
      background-color: #2b2d31;
      padding: 32px;
      border-radius: 8px;
      width: 400px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    #auth-container h2 {
      color: #f2f3f5;
      margin-bottom: 20px;
      text-align: center;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      color: #b5bac1;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      border-radius: 4px;
      border: none;
      background-color: #1e1f22;
      color: #f2f3f5;
      font-size: 14px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 4px;
      background-color: #5865f2;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #4752c4;
    }

    .toggle-text {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: #949ba4;
    }

    .toggle-text span {
      color: #00a8fc;
      cursor: pointer;
      text-decoration: underline;
    }

    /* --- 메인 채팅 화면 --- */
    #chat-container {
      display: none;
      width: 100%;
      height: 100vh;
      flex-direction: column;
      background-color: #313338;
    }

    .chat-header {
      height: 48px;
      background-color: #2b2d31;
      border-bottom: 2px solid #1e1f22;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      color: #f2f3f5;
      font-weight: bold;
    }

    .user-info {
      font-size: 14px;
      color: #b5bac1;
      margin-right: 12px;
    }

    .logout-btn {
      background-color: #da373c;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    /* 메시지 목록 */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* 📅 날짜 구분선 스타일 */
    .date-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px 0 12px 0;
      position: relative;
    }

    .date-divider::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 1px;
      background-color: #3f4147;
      z-index: 1;
    }

    .date-divider span {
      position: relative;
      z-index: 2;
      background-color: #313338;
      padding: 2px 12px;
      color: #949ba4;
      font-size: 12px;
      font-weight: 600;
      border-radius: 12px;
      border: 1px solid #3f4147;
    }

    .message-item {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      width: 100%;
    }

    .message-item.new-sender {
      margin-top: 12px; /* 작성자가 달라질 때 상단 여백 */
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #5865f2;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      flex-shrink: 0;
    }

    .avatar-spacer {
      width: 40px;
      flex-shrink: 0;
    }

    .message-content {
      display: flex;
      flex-direction: column;
      max-width: 70%;
    }

    .message-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }

    .nickname {
      color: #f2f3f5;
      font-weight: 600;
      font-size: 14px;
    }

    .timestamp {
      color: #949ba4;
      font-size: 11px;
      white-space: nowrap;
    }

    .message-body-row {
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }

    .bubble {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-all;
    }

    .other-bubble {
      background-color: #2b2d31;
      color: #dbdee1;
    }

    .my-message {
      justify-content: flex-end;
      align-items: flex-end;
      gap: 6px;
      margin-top: 4px;
    }

    .my-bubble {
      background-color: #5865f2;
      color: #ffffff;
      border-radius: 12px 12px 2px 12px;
      max-width: 70%;
    }

    .input-container {
      padding: 0 16px 24px 16px;
      background-color: #313338;
    }

    #chat-form {
      display: flex;
      background-color: #383a40;
      border-radius: 8px;
      padding: 0 16px;
      align-items: center;
    }

    #chat-input {
      flex: 1;
      padding: 12px 0;
      border: none;
      background: transparent;
      color: #f2f3f5;
      font-size: 14px;
      outline: none;
    }

    #send-btn {
      background: none;
      border: none;
      color: #5865f2;
      font-weight: bold;
      cursor: pointer;
      padding-left: 12px;
    }
  </style>
</head>
<body>

  <div id="auth-container">
    <h2 id="auth-title">로그인</h2>
    
    <div class="input-group" id="nickname-group" style="display: none;">
      <label>닉네임</label>
      <input type="text" id="nickname-input" placeholder="사용할 닉네임을 입력하세요">
    </div>

    <div class="input-group">
      <label>이메일</label>
      <input type="email" id="email-input" placeholder="name@example.com">
    </div>

    <div class="input-group">
      <label>비밀번호</label>
      <input type="password" id="password-input" placeholder="비밀번호 (6자리 이상)">
    </div>

    <button class="btn" id="auth-btn">로그인</button>

    <div class="toggle-text">
      <span id="toggle-auth">계정이 없으신가요? 회원가입</span>
    </div>
  </div>

  <div id="chat-container">
    <div class="chat-header">
      <div># 일반 채팅방</div>
      <div>
        <span class="user-info" id="current-user-info"></span>
        <button class="logout-btn" id="logout-btn">로그아웃</button>
      </div>
    </div>

    <div id="messages"></div>

    <div class="input-container">
      <form id="chat-form">
        <input type="text" id="chat-input" placeholder="메시지를 입력하세요..." autocomplete="off">
        <button type="submit" id="send-btn">전송</button>
      </form>
    </div>
  </div>

  <script>
   const firebaseConfig = {
  apiKey: "AIzaSyDRGQYScMifqnzBGvN8UfVx_mmHJL4MhPg",
  authDomain: "lilac-13935.firebaseapp.com",
  projectId: "lilac-13935",
  storageBucket: "lilac-13935.firebasestorage.app",
  messagingSenderId: "485552650048",
  appId: "1:485552650048:web:d05c5dd6ce989765a5aca5",
  measurementId: "G-81H89P6F6E"
};

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const socket = io();

    // DOM 요소
    const authContainer = document.getElementById('auth-container');
    const chatContainer = document.getElementById('chat-container');
    const authTitle = document.getElementById('auth-title');
    const nicknameGroup = document.getElementById('nickname-group');
    const nicknameInput = document.getElementById('nickname-input');
    const emailInput = document.getElementById('email-input');
    const passwordInput = document.getElementById('password-input');
    const authBtn = document.getElementById('auth-btn');
    const toggleAuth = document.getElementById('toggle-auth');
    const currentUserInfo = document.getElementById('current-user-info');
    const logoutBtn = document.getElementById('logout-btn');

    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const messages = document.getElementById('messages');

    let isSignUpMode = false;
    let currentUserNickname = "";

    // 실시간 메시지 연속 그룹화/시각/날짜 추적 변수
    let lastDate = null;
    let lastSender = null;
    let lastMsgTime = null;
    let lastMsgElement = null;

    // 로그인/회원가입 모드 전환
    toggleAuth.addEventListener('click', () => {
      isSignUpMode = !isSignUpMode;
      if (isSignUpMode) {
        authTitle.innerText = '회원가입';
        nicknameGroup.style.display = 'block';
        authBtn.innerText = '회원가입 완료';
        toggleAuth.innerText = '이미 계정이 있으신가요? 로그인';
      } else {
        authTitle.innerText = '로그인';
        nicknameGroup.style.display = 'none';
        authBtn.innerText = '로그인';
        toggleAuth.innerText = '계정이 없으신가요? 회원가입';
      }
    });

    // 로그인 및 회원가입
    authBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      const nickname = nicknameInput.value.trim();

      if (!email || !password) {
        alert('이메일과 비밀번호를 입력해 주세요.');
        return;
      }

      try {
        if (isSignUpMode) {
          if (!nickname) {
            alert('닉네임을 입력해 주세요.');
            return;
          }
          const userCredential = await auth.createUserWithEmailAndPassword(email, password);
          await userCredential.user.updateProfile({ displayName: nickname });
          await auth.currentUser.reload();
          currentUserNickname = auth.currentUser.displayName || nickname;
          alert('회원가입 성공!');
        } else {
          await auth.signInWithEmailAndPassword(email, password);
        }
      } catch (error) {
        alert('오류 발생: ' + error.message);
      }
    });

    // 로그인 상태 감지
    auth.onAuthStateChanged((user) => {
      if (user) {
        currentUserNickname = user.displayName || currentUserNickname || '익명';
        currentUserInfo.innerText = `${currentUserNickname}님 환영합니다!`;
        
        authContainer.style.display = 'none';
        chatContainer.style.display = 'flex';
      } else {
        authContainer.style.display = 'block';
        chatContainer.style.display = 'none';
        currentUserNickname = "";
        
        // 상태 리셋
        resetTrackingVars();
      }
    });

    logoutBtn.addEventListener('click', () => {
      auth.signOut();
    });

    function resetTrackingVars() {
      lastDate = null;
      lastSender = null;
      lastMsgTime = null;
      lastMsgElement = null;
    }

    // 현재 분 단위 시각 (예: "오후 12:02")
    function getCurrentTime() {
      const now = new Date();
      return now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    }

    // 현재 날짜 구하기 (예: "2026년 7월 28일 화요일")
    function getFullDate() {
      const now = new Date();
      return now.toLocaleDateString('ko-KR', {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        weekday: 'long'
      });
    }

    // 메시지 전송 이벤트
    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const msg = chatInput.value.trim();
      
      if (msg && currentUserNickname) {
        socket.emit('chat message', {
          nickname: currentUserNickname,
          text: msg,
          time: getCurrentTime(),
          fullDate: getFullDate()
        });
        chatInput.value = '';
      }
    });

    // 📅 날짜 구분선 DOM 생성
    function renderDateDivider(dateStr) {
      const divider = document.createElement('div');
      divider.className = 'date-divider';
      divider.innerHTML = `<span>${dateStr}</span>`;
      messages.appendChild(divider);
    }

    // 💬 단일 메시지 렌더링 함수
    function renderMessage(data) {
      const msgDate = data.fullDate || getFullDate();

      // 1️⃣ 날짜가 변경되었거나 첫 메시지일 경우 날짜 구분선 출력
      if (lastDate !== msgDate) {
        renderDateDivider(msgDate);
        lastDate = msgDate;
        // 날짜가 바뀌었으므로 작성자 그룹 초기화
        lastSender = null;
        lastMsgTime = null;
        lastMsgElement = null;
      }

      const isMe = (data.nickname === currentUserNickname);
      const isSameSender = (lastSender === data.nickname);
      const isSameTime = (lastMsgTime === data.time);

      // 2️⃣ 동일인 + 동일 분(Minute)인 경우 이전 메시지 시각 삭제
      if (isSameSender && isSameTime && lastMsgElement) {
        const prevTimestamp = lastMsgElement.querySelector('.timestamp');
        if (prevTimestamp) {
          prevTimestamp.textContent = '';
        }
      }

      const item = document.createElement('div');

      if (isMe) {
        // 내가 보낸 메시지
        item.className = 'message-item my-message';
        item.innerHTML = `
          <span class="timestamp">${data.time}</span>
          <div class="bubble my-bubble">${escapeHtml(data.text)}</div>
        `;
      } else {
        // 상대방이 보낸 메시지
        const initial = data.nickname ? data.nickname.charAt(0) : '?';

        if (isSameSender) {
          // 연속 메시지 (아바타/닉네임 생략)
          item.className = 'message-item continuous';
          item.innerHTML = `
            <div class="avatar-spacer"></div>
            <div class="message-content">
              <div class="message-body-row">
                <div class="bubble other-bubble">${escapeHtml(data.text)}</div>
                <span class="timestamp">${data.time}</span>
              </div>
            </div>
          `;
        } else {
          // 신규 작성자 메시지
          item.className = 'message-item new-sender';
          item.innerHTML = `
            <div class="avatar">${initial}</div>
            <div class="message-content">
              <div class="message-header">
                <span class="nickname">${data.nickname}</span>
              </div>
              <div class="message-body-row">
                <div class="bubble other-bubble">${escapeHtml(data.text)}</div>
                <span class="timestamp">${data.time}</span>
              </div>
            </div>
          `;
        }
      }

      // 상태 갱신
      lastSender = data.nickname;
      lastMsgTime = data.time;
      lastMsgElement = item;

      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    }

    // 📜 1. 서버에 저장되어 있던 이전 대화 목록 불러오기
    socket.on('chat history', (history) => {
      messages.innerHTML = ''; // 초기화
      resetTrackingVars();
      
      history.forEach((msg) => {
        renderMessage(msg);
      });
    });

    // 📩 2. 실시간 단일 메시지 수신
    socket.on('chat message', (data) => {
      renderMessage(data);
    });

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
