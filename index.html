<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; height: 100vh;
      background-color: #313338; color: #dbdee1;
      font-family: 'Noto Sans KR', sans-serif, system-ui;
      display: flex; justify-content: center; align-items: center;
      user-select: none;
      overflow: hidden;
    }

    /* 커스텀 스크롤바 */
    ::-webkit-scrollbar { width: 9.5px; height: 9.5px; }
    ::-webkit-scrollbar-track { background: #2b2d31; border-radius: 5px; }
    ::-webkit-scrollbar-thumb { background: #80848e; border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: #b5bac1; }

    /* 로그인 화면 */
    #auth-container {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #2b2d31; padding: 40px; border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3); width: 400px;
    }
    #auth-container h2 { color: #f2f3f5; margin-bottom: 24px; font-size: 24px; }
    .auth-input {
      width: 100%; padding: 12px; background: #1e1f22; border: 1px solid #111214;
      border-radius: 4px; color: #dbdee1; font-size: 15px; margin-bottom: 16px; outline: none;
    }
    .auth-input:focus { border-color: #00a8fc; }
    .auth-btn {
      width: 100%; padding: 12px; background: #5865f2; color: white;
      border: none; border-radius: 4px; font-size: 16px; font-weight: 600; cursor: pointer;
      transition: background 0.2s;
    }
    .auth-btn:hover { background: #4752c4; }

    /* 메인 채팅 앱 레이아웃 */
    #app-container {
      display: none; width: 100vw; height: 100vh; background-color: #313338;
      flex-direction: row; overflow: hidden;
    }

    .servers-sidebar { width: 72px; background: #1e1f22; display: flex; flex-direction: column; align-items: center; padding-top: 12px; gap: 8px; }
    .channels-sidebar { width: 240px; background: #2b2d31; display: flex; flex-direction: column; border-right: 1px solid #202225; }
    
    .chat-main { flex: 1; display: flex; flex-direction: column; background: #313338; position: relative; }
    .chat-header { height: 48px; border-bottom: 1px solid #202225; display: flex; align-items: center; padding: 0 16px; font-weight: bold; color: #f2f3f5; }
    
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    
    /* 메시지 행 스타일 (기본: 남이 보낸 것 좌측 정렬) */
    .message-row { display: flex; gap: 16px; position: relative; padding: 4px 16px; width: 100%; }
    .message-row:hover { background-color: rgba(255,255,255,0.02); }

    /* 🔑 내가 보낸 메시지: 우측 정렬 및 반전 배치 */
    .message-row.mine {
      flex-direction: row-reverse;
    }
    
    .avatar { width: 40px; height: 40px; border-radius: 50%; background: #5865f2; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; flex-shrink: 0; }
    
    /* 메시지 컨텐츠 영역 */
    .message-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      max-width: 75%;
    }
    /* 내가 보낸 메시지 컨텐츠 내부 정렬 우측으로 변경 */
    .message-row.mine .message-content {
      align-items: flex-end;
    }

    .message-header-info { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
    .message-row.mine .message-header-info {
      flex-direction: row-reverse; /* 이름과 시간 순서 유지하면서 우측 정렬 */
    }

    .username { font-weight: 600; color: #f2f3f5; font-size: 15px; }
    .timestamp { font-size: 12px; color: #949ba4; }

    /* 말풍선 박스 */
    .message-bubble {
      width: fit-content;
      max-width: 100%;
      word-break: break-word;
      color: #dbdee1;
      font-size: 15px;
      line-height: 1.4;
    }
    .message-bubble.deleted { color: #949ba4; font-style: italic; }

    /* 🔑 답장 미리보기 박스 및 답장 표시 텍스트 길이 제한 (말줄임표 적용) */
    .reply-preview-box, .message-reply-info {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: inline-block;
      font-size: 12px;
      color: #b5bac1;
      margin-bottom: 2px;
      background: rgba(255,255,255,0.05);
      padding: 2px 6px;
      border-radius: 4px;
      border-left: 3px solid #5865f2;
    }

    /* 호버 액션 버튼 (위치 조정) */
    .message-hover-actions {
      position: absolute; right: 24px; top: -12px; display: none;
      background: #313338; border: 1px solid #202225; border-radius: 4px; padding: 4px; gap: 4px;
    }
    .message-row.mine .message-hover-actions {
      left: 24px; right: auto; /* 내가 보낸 메시지는 호버 버튼 위치를 좌측으로 */
    }
    .message-row:hover .message-hover-actions { display: flex; }
    .action-btn { background: none; border: none; color: #b5bac1; cursor: pointer; padding: 4px 8px; border-radius: 3px; font-size: 13px; }
    .action-btn:hover { background: #35373c; color: #f2f3f5; }

    /* 하단 입력창 영역 */
    .chat-input-area { padding: 0 16px 24px 16px; display: flex; flex-direction: column; gap: 8px; }
    
    #reply-preview-container {
      display: none; background: #2b2d31; padding: 8px 12px; border-radius: 4px 4px 0 0;
      justify-content: space-between; align-items: center; font-size: 13px; color: #b5bac1;
      border-left: 4px solid #5865f2;
    }
    #reply-preview-container.active { display: flex; }
    #reply-preview-text {
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 85%;
    }
    .cancel-reply-btn { background: none; border: none; color: #b5bac1; cursor: pointer; }
    .cancel-reply-btn:hover { color: #f2f3f5; }

    .chat-input-wrapper { background: #383a40; border-radius: 8px; padding: 10px 16px; display: flex; flex-direction: column; }
    .chat-input { background: transparent; border: none; color: #dbdee1; font-size: 15px; outline: none; width: 100%; resize: none; max-height: 150px; }

    /* 우측 유저 목록 */
    .users-sidebar { width: 240px; background: #2b2d31; border-left: 1px solid #202225; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .user-item { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #dbdee1; padding: 4px 0; }
    .user-status-dot { width: 8px; height: 8px; background: #23a55a; border-radius: 50%; }
  </style>
</head>
<body>

  <div id="auth-container">
    <h2>채팅 시작하기</h2>
    <input type="text" id="username-input" class="auth-input" placeholder="사용할 닉네임을 입력하세요">
    <button id="login-btn" class="auth-btn">입장하기</button>
  </div>

  <div id="app-container">
    <div class="servers-sidebar"></div>
    <div class="channels-sidebar"></div>
    
    <div class="chat-main">
      <div class="chat-header"># general-chat</div>
      <div class="chat-messages" id="chat-messages"></div>
      
      <div class="chat-input-area">
        <div id="reply-preview-container">
          <span id="reply-preview-text">답장할 메시지 내용</span>
          <button class="cancel-reply-btn" id="cancel-reply-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="chat-input-wrapper">
          <textarea id="message-input" class="chat-input" placeholder="메시지를 입력하세요..."></textarea>
        </div>
      </div>
    </div>

    <div class="users-sidebar">
      <h3>참여 멤버</h3>
      <div id="users-list"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentUser = '';
    let currentReplyTarget = null;

    const authContainer = document.getElementById('auth-container');
    const appContainer = document.getElementById('app-container');
    const usernameInput = document.getElementById('username-input');
    const loginBtn = document.getElementById('login-btn');
    const messageInput = document.getElementById('message-input');
    const chatMessages = document.getElementById('chat-messages');
    
    const replyPreviewContainer = document.getElementById('reply-preview-container');
    const replyPreviewText = document.getElementById('reply-preview-text');
    const cancelReplyBtn = document.getElementById('cancel-reply-btn');
    const usersList = document.getElementById('users-list');

    loginBtn.addEventListener('click', () => {
      const name = usernameInput.value.trim();
      if (!name) return alert('닉네임을 입력해주세요!');
      currentUser = name;
      authContainer.style.display = 'none';
      appContainer.style.display = 'flex';

      socket.emit('join user', currentUser);
    });

    function setReplyTarget(msg) {
      currentReplyTarget = msg;
      replyPreviewText.innerText = `${msg.user}: ${msg.text}`;
      replyPreviewContainer.classList.add('active');
      messageInput.focus();
    }

    cancelReplyBtn.addEventListener('click', () => {
      currentReplyTarget = null;
      replyPreviewContainer.classList.remove('active');
    });

    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const text = messageInput.value.trim();
        if (!text) return;

        socket.emit('chat message', {
          user: currentUser,
          text: text,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          replyTo: currentReplyTarget ? { user: currentReplyTarget.user, text: currentReplyTarget.text } : null
        });

        messageInput.value = '';
        currentReplyTarget = null;
        replyPreviewContainer.classList.remove('active');
      }
    });

    socket.on('chat message', (msg) => {
      const row = document.createElement('div');
      row.className = 'message-row';

      const isMine = (msg.user === currentUser);
      if (isMine) {
        row.classList.add('mine'); // 🔑 내가 보낸 메시지 우측 정렬 클래스 적용
      }

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.innerText = msg.user[0].toUpperCase();
      row.appendChild(avatar);

      const content = document.createElement('div');
      content.className = 'message-content';

      // 🔑 답장 정보 표시 (길이가 길면 자동으로 ... 말줄임 처리)
      if (msg.replyTo) {
        const replyInfo = document.createElement('div');
        replyInfo.className = 'message-reply-info';
        replyInfo.innerHTML = `<i class="fa-solid fa-reply fa-flip-horizontal"></i> <b>${msg.replyTo.user}</b>: ${msg.replyTo.text}`;
        content.appendChild(replyInfo);
      }

      const headerInfo = document.createElement('div');
      headerInfo.className = 'message-header-info';
      headerInfo.innerHTML = `<span class="username">${msg.user}</span><span class="timestamp">${msg.time}</span>`;
      content.appendChild(headerInfo);

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      
      if (msg.isDeleted) {
        bubble.classList.add('deleted');
        bubble.innerHTML = `<span style="font-size:13px; opacity:0.7;">🚫</span> 삭제된 메시지입니다.`;
      } else {
        bubble.innerText = msg.text || '';
      }
      content.appendChild(bubble);
      row.appendChild(content);

      // 호버 답장 버튼
      if (!msg.isDeleted) {
        const hoverActions = document.createElement('div');
        hoverActions.className = 'message-hover-actions';
        hoverActions.innerHTML = `<button class="action-btn hover-reply-btn" title="답장"><i class="fa-solid fa-reply"></i> 답장</button>`;
        
        hoverActions.querySelector('.hover-reply-btn').addEventListener('click', () => {
          setReplyTarget(msg);
        });
        
        row.appendChild(hoverActions);
      }

      chatMessages.appendChild(row);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    });

    socket.on('update users', (users) => {
      usersList.innerHTML = '';
      users.forEach(username => {
        const userDiv = document.createElement('div');
        userDiv.className = 'user-item';
        userDiv.innerHTML = `<div class="user-status-dot"></div><span>${username}</span>`;
        usersList.appendChild(userDiv);
      });
    });
  </script>
</body>
</html>
