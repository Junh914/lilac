<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미니 디스코드</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; height: 100vh;
      background-color: #313338; color: #dbdee1;
      font-family: 'Noto Sans KR', sans-serif, system-ui;
      display: flex; justify-content: center; align-items: center;
      user-select: none;
    }

    /* 디스코드 스타일 커스텀 스크롤바 */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #2b2d31;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #1a1b1e;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #111214;
    }

    #auth-container {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; height: 100vh; background-color: #313338;
    }
    .auth-box {
      background-color: #2b2d31; padding: 30px; border-radius: 8px;
      width: 350px; display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: center;
    }
    .auth-box h2 { color: #f2f3f5; margin-top: 0; margin-bottom: 5px; }
    .auth-box input {
      padding: 10px; border-radius: 4px; border: 1px solid #1e1f22;
      background-color: #1e1f22; color: #dbdee1; font-size: 14px; outline: none;
    }
    .auth-box button#auth-action-btn {
      padding: 10px; border-radius: 4px; border: none; margin-top: 5px;
      background-color: #5865f2; color: white; font-weight: bold; cursor: pointer; font-size: 14px;
    }
    .auth-box button#auth-action-btn:hover { background-color: #4752c4; }
    .toggle-link-text {
      color: #949ba4; font-size: 11px; cursor: pointer; text-decoration: underline; margin-top: 6px;
    }
    .toggle-link-text:hover { color: #00a8fc; }

    /* 초기 깜빡임 방지를 위해 기본값을 반드시 display: none으로 고정 */
    #chat-container {
      display: none; width: 100%; height: 100vh; background-color: #313338; flex-direction: row;
    }

    /* 사이드바와 채팅 영역 기본 비율을 6.4 : 30 비율로 설정 (calc 활용) */
    .sidebar {
      width: calc(100% * 6.4 / 36.4); min-width: 180px; max-width: 400px;
      background-color: #2b2d31; display: flex; flex-direction: column;
      border-right: 1px solid #1f2023; position: relative; flex-shrink: 0;
    }
    
    /* 부드러운 리사이저 */
    .sidebar-resizer {
      width: 6px; height: 100%; position: absolute; right: -3px; top: 0;
      cursor: ew-resize; z-index: 10; background-color: transparent;
    }
    .sidebar-resizer:hover::after, .sidebar-resizer.resizing::after {
      content: ''; position: absolute; left: 2px; top: 0; width: 2px; height: 100%;
      background-color: #5865f2;
    }

    .sidebar-header {
      height: 60px; padding: 0 16px; display: flex; align-items: center;
      font-weight: bold; font-size: 16px; color: #f2f3f5; border-bottom: 1px solid #1f2023;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .channel-list { flex: 1; padding: 16px; overflow-y: auto; }
    .channel-item { padding: 8px 10px; border-radius: 4px; color: #949ba4; cursor: pointer; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .channel-item.active { background-color: #404249; color: #f2f3f5; }

    .user-panel {
      height: 60px; background-color: #232428; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; flex-shrink: 0;
    }
    .user-profile-info { display: flex; align-items: center; gap: 8px; overflow: hidden; cursor: pointer; flex: 1; min-width: 0; }
    .user-avatar-small {
      width: 36px; height: 36px; border-radius: 50%; background-color: #5865f2;
      display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 14px;
      overflow: hidden; flex-shrink: 0;
    }
    .user-avatar-small img { width: 100%; height: 100%; object-fit: cover; }
    .user-name-tag { display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
    .user-display-name { font-size: 14px; font-weight: bold; color: #f2f3f5; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }
    .user-status { font-size: 11px; color: #23a55a; }
    
    .settings-icon-btn {
      background: none; border: none; color: #b5bac1; cursor: pointer; font-size: 18px; padding: 6px; border-radius: 4px; flex-shrink: 0;
    }
    .settings-icon-btn:hover { background-color: #35373c; color: #f2f3f5; }

    .chat-area { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header {
      height: 60px; background-color: #313338; border-bottom: 1px solid #1f2023;
      display: flex; align-items: center; padding: 0 20px; font-weight: bold; font-size: 16px; color: #f2f3f5;
    }

    .chat-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

    .date-divider {
      display: flex; align-items: center; text-align: center; margin: 20px 0; color: #949ba4; font-size: 12px; font-weight: 600;
    }
    .date-divider::before, .date-divider::after { content: ''; flex: 1; border-bottom: 1px solid #3f444b; }
    .date-divider span {
      padding: 4px 12px; background-color: #2b2d31; border: 1px solid #3f444b; border-radius: 12px; margin: 0 10px; color: #dbdee1; white-space: nowrap;
    }

    .message-row { display: flex; align-items: flex-end; gap: 8px; max-width: 75%; }
    .message-row.mine { align-self: flex-end; flex-direction: row-reverse; }
    .message-row.mine .message-content { align-items: flex-end; }
    .message-row.mine .message-bubble { background-color: #5865f2; color: white; border-radius: 12px; border-bottom-right-radius: 2px; }
    
    .message-row.other { align-self: flex-start; }
    .message-row.other .message-content { align-items: flex-start; }
    .message-row.other .message-bubble { background-color: #2b2d31; color: #dbdee1; border-radius: 12px; border-bottom-left-radius: 2px; }

    .message-row.consecutive { margin-top: -6px; }
    .message-row.other.consecutive .avatar { visibility: hidden; height: 0; }
    .message-row.other.consecutive .message-header { display: none; }

    .avatar { width: 38px; height: 38px; border-radius: 50%; background-color: #5865f2; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 15px; flex-shrink: 0; overflow: hidden; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    
    .message-content { display: flex; flex-direction: column; gap: 4px; max-width: 100%; }
    .message-header { font-size: 12px; color: #f2f3f5; font-weight: bold; margin-bottom: 2px; }
    .message-bubble { padding: 10px 14px; word-break: break-all; font-size: 14px; line-height: 1.4; }
    
    .time-container { display: flex; align-items: flex-end; }
    .timestamp { font-size: 10px; color: #949ba4; margin: 0 4px 2px 4px; white-space: nowrap; }

    #message-form { padding: 20px; background-color: #313338; display: flex; gap: 10px; }
    #message-input { flex: 1; padding: 12px; border-radius: 8px; border: none; background-color: #383a40; color: #dbdee1; font-size: 14px; outline: none; }
    #send-btn { padding: 0 20px; border-radius: 8px; border: none; background-color: #5865f2; color: white; font-weight: bold; cursor: pointer; }

    /* 빠른 페이드아웃이 적용된 설정 모달 스타일 */
    #settings-modal {
      display: flex;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center;
    }
    #settings-modal.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background-color: #313338; width: 550px; border-radius: 8px; padding: 32px;
      display: flex; flex-direction: column; gap: 24px; box-shadow: 0 12px 32px rgba(0,0,0,0.6);
      position: relative;
    }
    .modal-header { color: #f2f3f5; font-size: 20px; font-weight: bold; margin-bottom: 4px; }
    
    .modal-close-btn {
      position: absolute; top: 20px; right: 20px;
      background: none; border: none; color: #949ba4; font-size: 24px; cursor: pointer;
      width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; border-radius: 50%;
    }
    .modal-close-btn:hover { color: #f2f3f5; background-color: rgba(255,255,255,0.05); }
    
    .settings-group { display: flex; flex-direction: column; gap: 10px; }
    .settings-group label { font-size: 13px; font-weight: bold; color: #b5bac1; text-transform: uppercase; }
    .settings-group input {
      padding: 12px; border-radius: 4px; border: 1px solid #1e1f22; background-color: #1e1f22; color: #dbdee1; font-size: 15px; outline: none;
    }
    .file-upload-label {
      display: inline-block; padding: 14px; background-color: #2b2d31; border: 1px dashed #5865f2;
      border-radius: 4px; text-align: center; color: #dbdee1; cursor: pointer; font-size: 14px;
    }
    .file-upload-label:hover { background-color: #35373c; }

    .settings-buttons { display: flex; justify-content: flex-end; gap: 12px; margin-top: 10px; }
    .btn-save { background-color: #5865f2; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn-save:hover { background-color: #4752c4; }
    .btn-logout-modal { background-color: #ed4245; color: white; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; }
  </style>
</head>
<body>

  <div id="auth-container">
    <div class="auth-box">
      <h2 id="auth-title">로그인</h2>
      <input type="email" id="email-input" placeholder="이메일 입력">
      <input type="text" id="nickname-input" style="display: none;" placeholder="사용할 닉네임 입력">
      <input type="password" id="password-input" placeholder="비밀번호 입력">
      <button type="button" id="auth-action-btn">로그인</button>
      <div><span class="toggle-link-text" id="toggle-mode-btn">계정이 없으신가요? 회원가입</span></div>
    </div>
  </div>

  <div id="chat-container">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">🌟 미니 디스코드</div>
      <div class="channel-list">
        <div class="channel-item active"># 자유채팅방</div>
      </div>
      <div class="user-panel">
        <div class="user-profile-info" id="open-settings-btn2">
          <div class="user-avatar-small" id="sidebar-avatar">유</div>
          <div class="user-name-tag">
            <span class="user-display-name" id="sidebar-nickname">닉네임</span>
            <span class="user-status">온라인</span>
          </div>
        </div>
        <button class="settings-icon-btn" id="open-settings-btn" title="설정">⚙️</button>
      </div>
      <div class="sidebar-resizer" id="sidebar-resizer"></div>
    </div>

    <div class="chat-area">
      <header><span># 자유채팅방</span></header>
      <div class="chat-main">
        <div id="messages"></div>
        <form id="message-form">
          <input type="text" id="message-input" placeholder="#자유채팅방에 메시지 보내기..." autocomplete="off">
          <button type="submit" id="send-btn">전송</button>
        </form>
      </div>
    </div>
  </div>

  <div id="settings-modal">
    <div class="modal-content">
      <button class="modal-close-btn" id="close-settings-btn">&times;</button>
      
      <div class="modal-header">사용자 설정</div>
      
      <div class="settings-group">
        <label>프로필 사진 파일 선택</label>
        <label for="setting-file-input" class="file-upload-label" id="file-label-text">컴퓨터에서 이미지 선택...</label>
        <input type="file" id="setting-file-input" accept="image/*" style="display: none;">
      </div>

      <div class="settings-group">
        <label>닉네임 변경</label>
        <input type="text" id="setting-nickname-input" placeholder="변경할 닉네임 입력">
      </div>

      <div class="settings-group">
        <label>새 비밀번호 변경 (변경시에만 입력)</label>
        <input type="password" id="setting-password-input" placeholder="새 비밀번호 입력">
      </div>

      <div class="settings-buttons">
        <button type="button" class="btn-logout-modal" id="modal-logout-btn">로그아웃</button>
        <button type="button" class="btn-save" id="save-settings-btn">저장하기</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, updatePassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

   const firebaseConfig = {
  apiKey: "AIzaSyDRGQYScMifqnzBGvN8UfVx_mmHJL4MhPg",
  authDomain: "lilac-13935.firebaseapp.com",
  projectId: "lilac-13935",
  storageBucket: "lilac-13935.firebasestorage.app",
  messagingSenderId: "485552650048",
  appId: "1:485552650048:web:d05c5dd6ce989765a5aca5",
  measurementId: "G-81H89P6F6E"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const socket = io({ transports: ['websocket'] });

    let isLoginMode = true;
    let currentUser = null;
    let selectedImageBase64 = null;

    let lastDateStr = null;
    let lastSenderId = null;
    let lastMinuteStr = null;
    let lastTimeElem = null;

    // 사이드바 너비 조절 최적화 (requestAnimationFrame 적용)
    const sidebar = document.getElementById('sidebar');
    const resizer = document.getElementById('sidebar-resizer');
    let isResizing = false;
    let rafId = null;

    resizer.addEventListener('mousedown', (e) => {
      isResizing = true;
      resizer.classList.add('resizing');
      e.preventDefault();
    });

    window.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(() => {
        const newWidth = e.clientX;
        if (newWidth >= 180 && newWidth <= 400) {
          sidebar.style.width = newWidth + 'px';
        }
      });
    });

    window.addEventListener('mouseup', () => {
      if (isResizing) {
        isResizing = false;
        resizer.classList.remove('resizing');
      }
    });

    const authContainer = document.getElementById('auth-container');
    const chatContainer = document.getElementById('chat-container');
    const messages = document.getElementById('messages');
    
    const settingsModal = document.getElementById('settings-modal');
    const openSettingsBtn = document.getElementById('open-settings-btn');
    const openSettingsBtn2 = document.getElementById('open-settings-btn2');
    const closeSettingsBtn = document.getElementById('close-settings-btn');
    const saveSettingsBtn = document.getElementById('save-settings-btn');
    const modalLogoutBtn = document.getElementById('modal-logout-btn');
    const fileInput = document.getElementById('setting-file-input');
    const fileLabelText = document.getElementById('file-label-text');

    openSettingsBtn.addEventListener('click', () => openModal());
    openSettingsBtn2.addEventListener('click', () => openModal());
    closeSettingsBtn.addEventListener('click', () => closeModal());

    settingsModal.addEventListener('click', (e) => {
      if (e.target === settingsModal) {
        closeModal();
      }
    });

    function openModal() {
      if (!currentUser) return;
      document.getElementById('setting-nickname-input').value = currentUser.displayName || '';
      document.getElementById('setting-password-input').value = '';
      fileLabelText.innerText = currentUser.photoURL ? "기존 프로필 있음 (변경하려면 선택)" : "컴퓨터에서 이미지 선택...";
      selectedImageBase64 = currentUser.photoURL || null;
      settingsModal.classList.add('show');
    }

    function closeModal() {
      settingsModal.classList.remove('show');
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      fileLabelText.innerText = file.name;

      const reader = new FileReader();
      reader.onload = (uploadEvent) => {
        selectedImageBase64 = uploadEvent.target.result;
      };
      reader.readAsDataURL(file);
    });

    saveSettingsBtn.addEventListener('click', async () => {
      const newNick = document.getElementById('setting-nickname-input').value.trim();
      const newPassword = document.getElementById('setting-password-input').value.trim();

      try {
        const updateData = {};
        if (newNick) updateData.displayName = newNick;
        if (selectedImageBase64 !== undefined) updateData.photoURL = selectedImageBase64;

        if (Object.keys(updateData).length > 0) {
          await updateProfile(auth.currentUser, updateData);
        }

        if (newPassword) {
          await updatePassword(auth.currentUser, newPassword);
        }

        await auth.currentUser.reload();
        currentUser = auth.currentUser;
        updateUserUI(currentUser);
        
        alert('설정이 성공적으로 저장되었습니다!');
        closeModal();
      } catch (e) {
        alert('설정 저장 실패: ' + e.message);
      }
    });

    modalLogoutBtn.addEventListener('click', () => {
      closeModal();
      signOut(auth);
    });

    function updateUserUI(user) {
      const nameElem = document.getElementById('sidebar-nickname');
      const avatarElem = document.getElementById('sidebar-avatar');

      nameElem.innerText = user.displayName || '익명';
      if (user.photoURL) {
        avatarElem.innerHTML = `<img src="${user.photoURL}" alt="아바타">`;
      } else {
        avatarElem.innerHTML = (user.displayName ? user.displayName[0] : '유').toUpperCase();
      }
    }

    document.getElementById('toggle-mode-btn').addEventListener('click', () => {
      isLoginMode = !isLoginMode;
      document.getElementById('auth-title').innerText = isLoginMode ? "로그인" : "회원가입";
      document.getElementById('auth-action-btn').innerText = isLoginMode ? "로그인" : "회원가입 완료";
      document.getElementById('toggle-mode-btn').innerText = isLoginMode ? "계정이 없으신가요? 회원가입" : "이미 계정이 있으신가요? 로그인";
      document.getElementById('nickname-input').style.display = isLoginMode ? "none" : "block";
    });

    document.getElementById('auth-action-btn').addEventListener('click', async () => {
      const email = document.getElementById('email-input').value.trim();
      const pw = document.getElementById('password-input').value.trim();
      const nick = document.getElementById('nickname-input').value.trim();

      if (!email || !pw || (!isLoginMode && !nick)) return alert('모든 필드를 입력해주세요.');

      try {
        if (isLoginMode) {
          await signInWithEmailAndPassword(auth, email, pw);
        } else {
          const cred = await createUserWithEmailAndPassword(auth, email, pw);
          await updateProfile(cred.user, { displayName: nick });
          await auth.currentUser.reload();
          alert('가입 완료!');
        }
      } catch (e) { alert('오류: ' + e.message); }
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        authContainer.style.display = 'none';
        chatContainer.style.display = 'flex';
        updateUserUI(user);
        
        socket.emit('join channel', 'general');
      } else {
        currentUser = null;
        chatContainer.style.display = 'none';
        authContainer.style.display = 'flex';
        messages.innerHTML = '';
      }
    });

    document.getElementById('message-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !currentUser) return;

      const now = new Date();
      const dateOptions = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
      const dateStr = now.toLocaleDateString('ko-KR', dateOptions);
      const timeStr = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

      socket.emit('chat message', {
        channel: 'general',
        uid: currentUser.uid,
        nickname: currentUser.displayName || '익명',
        photoURL: currentUser.photoURL || null,
        text: text,
        date: dateStr,
        time: timeStr
      });
      input.value = '';
    });

    socket.on('chat history', (data) => {
      messages.innerHTML = '';
      lastDateStr = null; lastSenderId = null; lastMinuteStr = null; lastTimeElem = null;
      if (data && data.history) {
        data.history.forEach(msg => appendMessage(msg));
      }
    });

    socket.on('chat message', (msg) => appendMessage(msg));

    function appendMessage(msg) {
      if (!currentUser) return;

      const isMine = (msg.uid === currentUser.uid);

      if (msg.date !== lastDateStr) {
        const divider = document.createElement('div');
        divider.className = 'date-divider';
        divider.innerHTML = `<span>${msg.date}</span>`;
        messages.appendChild(divider);
        
        lastDateStr = msg.date;
        lastSenderId = null;
      }

      const isConsecutive = (lastSenderId === msg.uid && lastMinuteStr === msg.time);
      
      const row = document.createElement('div');
      row.className = `message-row ${isMine ? 'mine' : 'other'} ${isConsecutive ? 'consecutive' : ''}`;

      if (!isMine) {
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        if (msg.photoURL) {
          avatar.innerHTML = `<img src="${msg.photoURL}" alt="아바타">`;
        } else {
          avatar.innerText = (msg.nickname ? msg.nickname[0] : '유').toUpperCase();
        }
        row.appendChild(avatar);
      }

      const timeContainer = document.createElement('div');
      timeContainer.className = 'time-container';

      const content = document.createElement('div');
      content.className = 'message-content';

      if (!isMine && !isConsecutive) {
        const header = document.createElement('div');
        header.className = 'message-header';
        header.innerText = msg.nickname;
        content.appendChild(header);
      }

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.innerText = msg.text;
      content.appendChild(bubble);

      const timeDiv = document.createElement('div');
      timeDiv.className = 'timestamp';
      timeDiv.innerText = msg.time;

      if (isConsecutive && lastTimeElem) {
        lastTimeElem.style.display = 'none';
      }
      
      if (isMine) {
        timeContainer.appendChild(timeDiv);
        timeContainer.appendChild(content);
      } else {
        timeContainer.appendChild(content);
        timeContainer.appendChild(timeDiv);
      }

      row.appendChild(timeContainer);
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;

      lastTimeElem = timeDiv;
      lastSenderId = msg.uid;
      lastMinuteStr = msg.time;
    }
  </script>
</body>
</html>
