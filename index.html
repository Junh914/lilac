<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; height: 100vh;
      background-color: #313338; color: #dbdee1;
      font-family: 'Noto Sans KR', sans-serif, system-ui;
      display: flex; justify-content: center; align-items: center;
    }

    /* 로그인 / 회원가입 화면 스타일 */
    #auth-container {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; height: 100vh; background-color: #313338;
    }
    .auth-box {
      background-color: #2b2d31; padding: 30px; border-radius: 8px;
      width: 350px; display: flex; flex-direction: column; gap: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: center;
    }
    .auth-box h2 { color: #f2f3f5; margin-top: 0; }
    .auth-box input {
      padding: 10px; border-radius: 4px; border: 1px solid #1e1f22;
      background-color: #1e1f22; color: #dbdee1; font-size: 14px; outline: none;
    }
    .auth-box button {
      padding: 10px; border-radius: 4px; border: none;
      background-color: #5865f2; color: white; font-weight: bold; cursor: pointer;
    }
    .auth-box button:hover { background-color: #4752c4; }
    .toggle-btn {
      background: none; border: none; color: #00a8fc; cursor: pointer; font-size: 12px; margin-top: 5px;
    }

    /* 채팅 화면 스타일 */
    #chat-container {
      display: none; width: 100%; height: 100vh; background-color: #313338;
      flex-direction: column;
    }
    header {
      height: 60px; background-color: #2b2d31; border-bottom: 1px solid #1f2023;
      display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
      font-weight: bold; font-size: 18px; color: #f2f3f5;
    }
    #logout-btn {
      background-color: #ed4245; color: white; border: none; padding: 6px 12px;
      border-radius: 4px; cursor: pointer; font-size: 12px;
    }
    #logout-btn:hover { background-color: #c03537; }

    .chat-main {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
    }
    #messages {
      flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
    }

    /* 메시지 말풍선 좌우 정렬 구조 */
    .message-wrapper {
      display: flex; flex-direction: column; max-width: 60%;
    }
    /* 남이 보낸 것: 왼쪽 정렬 */
    .message-wrapper.left {
      align-self: flex-start; align-items: flex-start;
    }
    /* 내가 보낸 것: 오른쪽 정렬 */
    .message-wrapper.right {
      align-self: flex-end; align-items: flex-end;
    }

    .message-info {
      font-size: 11px; color: #949ba4; margin-bottom: 4px;
    }
    .message-bubble {
      padding: 10px 14px; border-radius: 8px; word-break: break-all; font-size: 14px; line-height: 1.4;
    }
    /* 남이 보낸 말풍선 색상 */
    .message-wrapper.left .message-bubble {
      background-color: #2b2d31; color: #dbdee1;
    }
    /* 내가 보낸 말풍선 색상 */
    .message-wrapper.right .message-bubble {
      background-color: #5865f2; color: white;
    }

    /* 입력창 영역 */
    #message-form {
      padding: 20px; background-color: #313338; display: flex; gap: 10px;
    }
    #message-input {
      flex: 1; padding: 12px; border-radius: 8px; border: none;
      background-color: #383a40; color: #dbdee1; font-size: 14px; outline: none;
    }
    #send-btn {
      padding: 0 20px; border-radius: 8px; border: none;
      background-color: #5865f2; color: white; font-weight: bold; cursor: pointer;
    }
    #send-btn:hover { background-color: #4752c4; }
  </style>
</head>
<body>

  <div id="auth-container">
    <div class="auth-box">
      <h2 id="auth-title">로그인</h2>
      <input type="email" id="email-input" placeholder="이메일 입력">
      <input type="password" id="password-input" placeholder="비밀번호 입력">
      <button id="auth-action-btn">로그인하기</button>
      <button class="toggle-btn" id="toggle-mode-btn">계정이 없으신가요? 회원가입</button>
    </div>
  </div>

  <div id="chat-container">
    <header>
      <span>자유채팅방</span>
      <button id="logout-btn">로그아웃</button>
    </header>
    <div class="chat-main">
      <div id="messages"></div>
      <form id="message-form">
        <input type="text" id="message-input" placeholder="자유채팅방에 메시지 보내기..." autocomplete="off">
        <button type="submit" id="send-btn">전송</button>
      </form>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInWithEmailAndPassword, 
      createUserWithEmailAndPassword, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
  apiKey: "AIzaSyDRGQYScMifqnzBGvN8UfVx_mmHJL4MhPg",
  authDomain: "lilac-13935.firebaseapp.com",
  projectId: "lilac-13935",
  storageBucket: "lilac-13935.firebasestorage.app",
  messagingSenderId: "485552650048",
  appId: "1:485552650048:web:d05c5dd6ce989765a5aca5",
  measurementId: "G-81H89P6F6E"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const socket = io();

    let isLoginMode = true;
    let currentUser = null;

    const authContainer = document.getElementById('auth-container');
    const chatContainer = document.getElementById('chat-container');
    const authTitle = document.getElementById('auth-title');
    const authActionBtn = document.getElementById('auth-action-btn');
    const toggleModeBtn = document.getElementById('toggle-mode-btn');
    const emailInput = document.getElementById('email-input');
    const passwordInput = document.getElementById('password-input');
    const logoutBtn = document.getElementById('logout-btn');
    const messages = document.getElementById('messages');

    // 로그인 / 회원가입 모드 전환
    toggleModeBtn.addEventListener('click', () => {
      isLoginMode = !isLoginMode;
      if (isLoginMode) {
        authTitle.innerText = "로그인";
        authActionBtn.innerText = "로그인하기";
        toggleModeBtn.innerText = "계정이 없으신가요? 회원가입";
      } else {
        authTitle.innerText = "회원가입";
        authActionBtn.innerText = "회원가입하기";
        toggleModeBtn.innerText = "이미 계정이 있으신가요? 로그인";
      }
    });

    // 로그인 / 회원가입 실행 버튼
    authActionBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      if (!email || !password) {
        alert('이메일과 비밀번호를 모두 입력해주세요.');
        return;
      }

      try {
        if (isLoginMode) {
          await signInWithEmailAndPassword(auth, email, password);
        } else {
          await createUserWithEmailAndPassword(auth, email, password);
          alert('회원가입이 완료되었습니다!');
        }
      } catch (error) {
        alert('인증 오류: ' + error.message);
      }
    });

    // 로그아웃
    logoutBtn.addEventListener('click', () => {
      signOut(auth);
    });

    // Firebase 인증 상태 감지
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        authContainer.style.display = 'none';
        chatContainer.style.display = 'flex';
        // 자유채팅방 단일 채널 접속 요청
        socket.emit('join channel', 'general');
      } else {
        currentUser = null;
        chatContainer.style.display = 'none';
        authContainer.style.display = 'flex';
        messages.innerHTML = '';
      }
    });

    // 메시지 전송 이벤트
    document.getElementById('message-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !currentUser) return;

      const now = new Date();
      const timeStr = now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

      socket.emit('chat message', {
        channel: 'general',
        uid: currentUser.uid,
        nickname: currentUser.email.split('@')[0], // 이메일 앞부분을 닉네임으로 사용
        text: text,
        time: timeStr
      });

      input.value = '';
    });

    // 서버로부터 3개월 이내의 이전 대화 내역 수신
    socket.on('chat history', (data) => {
      messages.innerHTML = '';
      if (data.history) {
        data.history.forEach(msg => appendMessage(msg));
      }
    });

    // 실시간 새 메시지 수신 (좌우 정렬 분기 처리)
    socket.on('chat message', (msg) => {
      appendMessage(msg);
    });

    function appendMessage(msg) {
      const isMine = currentUser && msg.uid === currentUser.uid;

      const wrapper = document.createElement('div');
      wrapper.className = `message-wrapper ${isMine ? 'right' : 'left'}`;

      const info = document.createElement('div');
      info.className = 'message-info';
      info.innerText = `${msg.nickname} • ${msg.time}`;

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.innerText = msg.text;

      wrapper.appendChild(info);
      wrapper.appendChild(bubble);
      messages.appendChild(wrapper);
      messages.scrollTop = messages.scrollHeight;
    }
  </script>
</body>
</html>
