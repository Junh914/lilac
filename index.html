<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; height: 100vh;
      background-color: #313338; color: #dbdee1;
      font-family: 'Noto Sans KR', sans-serif, system-ui;
      display: flex; justify-content: center; align-items: center;
      user-select: none;
    }

    ::-webkit-scrollbar { width: 9.5px; height: 9.5px; }
    ::-webkit-scrollbar-track { background: #2b2d31; border-radius: 5px; }
    ::-webkit-scrollbar-thumb { background: #80848e; border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: #b5bac1; }

    #auth-container {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; height: 100vh; background-color: #313338;
    }
    .auth-box {
      background-color: #2b2d31; padding: 32px; border-radius: 8px;
      width: 410px; box-shadow: 0 2px 10px 0 rgba(0,0,0,0.2);
    }
    .auth-title { font-size: 24px; font-weight: 600; color: #f2f3f5; margin-bottom: 8px; text-align: center; }
    .auth-subtitle { font-size: 14px; color: #949ba4; margin-bottom: 20px; text-align: center; }
    .auth-input {
      width: 100%; background-color: #1e1f22; border: 1px solid transparent;
      border-radius: 3px; color: #dbdee1; padding: 10px; font-size: 16px; margin-bottom: 16px; outline: none;
    }
    .auth-input:focus { border-color: #00a8fc; }
    .auth-btn {
      width: 100%; background-color: #5865f2; color: white; border: none;
      border-radius: 3px; padding: 10px; font-size: 16px; font-weight: 500; cursor: pointer;
    }
    .auth-btn:hover { background-color: #4752c4; }
    .auth-toggle { margin-top: 15px; font-size: 14px; color: #00a8fc; cursor: pointer; text-align: center; }
    .auth-toggle:hover { text-decoration: underline; }

    /* 전체 앱 레이아웃 */
    #app-container {
      display: none; width: 100vw; height: 100vh; background-color: #313338; overflow: hidden;
    }
    .main-layout {
      display: flex; width: 100%; height: 100%;
    }

    /* 사이드바 (기본 비율 6.4 반영 - 초기 너비 약 260px 및 리사이즈 지원) */
    .sidebar {
      width: 260px; /* 초기 기본 너비 */
      min-width: 180px; 
      max-width: 450px;
      background-color: #2b2d31; 
      display: flex; 
      flex-direction: column;
      border-right: 1px solid #1f2023; 
      position: relative; 
      flex-shrink: 0;
    }

    /* 리사이즈 핸들 바 */
    .sidebar-resizer {
      width: 6px; 
      height: 100%; 
      position: absolute; 
      right: -3px; 
      top: 0;
      cursor: ew-resize; 
      z-index: 10; 
      background-color: transparent;
    }
    .sidebar-resizer:hover::after, .sidebar-resizer.resizing::after {
      content: ''; 
      position: absolute; 
      left: 2px; 
      top: 0; 
      width: 2px; 
      height: 100%;
      background-color: #5865f2;
    }

    .sidebar-header {
      padding: 16px; font-weight: bold; font-size: 16px; color: #f2f3f5;
      border-bottom: 1px solid #1f2023; display: flex; justify-content: space-between; align-items: center;
    }
    .channels-list { flex: 1; overflow-y: auto; padding: 8px; }
    .channel-item {
      padding: 8px 10px; border-radius: 4px; color: #949ba4; cursor: pointer;
      margin-bottom: 2px; font-weight: 500; display: flex; align-items: center; gap: 8px;
    }
    .channel-item:hover { background-color: #35373c; color: #dbdee1; }
    .channel-item.active { background-color: #404249; color: #ffffff; }

    .user-profile-bar {
      padding: 10px; background-color: #232428; display: flex; align-items: center; gap: 8px;
    }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; background-color: #5865f2; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; }
    .user-info { flex: 1; overflow: hidden; }
    .user-name { font-size: 14px; font-weight: bold; color: #f2f3f5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-status { font-size: 12px; color: #949ba4; }
    .logout-btn { background: none; border: none; color: #949ba4; cursor: pointer; font-size: 14px; }
    .logout-btn:hover { color: #f2f3f5; }

    /* 채팅 영역 (비율 30에 대응하도록 flex: 1 설정) */
    .chat-area {
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      height: 100vh; 
      background-color: #313338; 
      overflow: hidden;
    }
    .chat-header {
      padding: 16px; font-weight: bold; font-size: 16px; color: #f2f3f5;
      border-bottom: 1px solid #1f2023; background-color: #313338;
      display: flex; align-items: center; gap: 8px;
    }
    .chat-messages {
      flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;
    }
    .message-row { display: flex; gap: 16px; width: 100%; }
    .message-row.mine { flex-direction: row-reverse; }
    .message-avatar { width: 40px; height: 40px; border-radius: 50%; background-color: #5865f2; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; flex-shrink: 0; }
    .time-container { display: flex; align-items: flex-end; gap: 8px; max-width: 70%; }
    .message-row.mine .time-container { flex-direction: row-reverse; }
    .message-content { display: flex; flex-direction: column; gap: 4px; }
    .message-header { font-size: 14px; font-weight: 600; color: #f2f3f5; }
    .message-bubble {
      background-color: #2b2d31; padding: 8px 12px; border-radius: 8px;
      word-break: break-all; color: #dbdee1; font-size: 15px; line-height: 1.4;
    }
    .message-row.mine .message-bubble { background-color: #5865f2; color: #ffffff; }
    .timestamp { font-size: 11px; color: #949ba4; white-space: nowrap; }

    .chat-input-area { padding: 0 16px 24px 16px; }
    .chat-input-box {
      background-color: #383a40; border-radius: 8px; padding: 10px 16px;
      display: flex; align-items: center; gap: 10px;
    }
    .chat-input {
      flex: 1; background: none; border: none; color: #dbdee1; font-size: 15px; outline: none;
    }
    .send-btn {
      background-color: #5865f2; color: white; border: none; border-radius: 4px;
      padding: 6px 12px; cursor: pointer; font-weight: 500;
    }
    .send-btn:hover { background-color: #4752c4; }
  </style>
</head>
<body>

  <div id="auth-container">
    <div class="auth-box">
      <div class="auth-title" id="auth-title">로그인</div>
      <div class="auth-subtitle" id="auth-subtitle">채팅을 시작하려면 로그인하세요</div>
      
      <input type="text" id="email" class="auth-input" placeholder="이메일">
      <input type="password" id="password" class="auth-input" placeholder="비밀번호">
      <input type="text" id="nickname" class="auth-input" placeholder="닉네임 (회원가입용)" style="display:none;">
      
      <button class="auth-btn" id="auth-btn" onclick="handleAuth()">로그인</button>
      <div class="auth-toggle" id="auth-toggle" onclick="toggleMode()">계정이 없으신가요? 회원가입</div>
    </div>
  </div>

  <div id="app-container">
    <div class="main-layout">
      <div class="sidebar" id="sidebar">
        <div class="sidebar-resizer" id="sidebar-resizer"></div>
        <div class="sidebar-header">
          <span>채널 목록</span>
        </div>
        <div class="channels-list" id="channels-list">
          <div class="channel-item active" onclick="switchChannel('general')"># general</div>
          <div class="channel-item" onclick="switchChannel('development')"># development</div>
          <div class="channel-item" onclick="switchChannel('random')"># random</div>
        </div>
        <div class="user-profile-bar">
          <div class="user-avatar" id="current-user-avatar">유</div>
          <div class="user-info">
            <div class="user-name" id="current-user-name">사용자</div>
            <div class="user-status">온라인</div>
          </div>
          <button class="logout-btn" onclick="handleLogout()">로그아웃</button>
        </div>
      </div>

      <div class="chat-area">
        <div class="chat-header" id="current-channel-title"># general</div>
        <div class="chat-messages" id="messages"></div>
        <div class="chat-input-area">
          <div class="chat-input-box">
            <input type="text" id="message-input" class="chat-input" placeholder="#general에 메시지 보내기" onkeypress="handleKeyPress(event)">
            <button class="send-btn" onclick="sendMessage()">전송</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    let isSignUp = false;
    let currentUser = null;
    let currentChannel = 'general';

    function toggleMode() {
      isSignUp = !isSignUp;
      document.getElementById('auth-title').innerText = isSignUp ? '회원가입' : '로그인';
      document.getElementById('auth-subtitle').innerText = isSignUp ? '새 계정을 만들어보세요' : '채팅을 시작하려면 로그인하세요';
      document.getElementById('auth-btn').innerText = isSignUp ? '회원가입' : '로그인';
      document.getElementById('auth-toggle').innerText = isSignUp ? '이미 계정이 있으신가요? 로그인' : '계정이 없으신가요? 회원가입';
      document.getElementById('nickname').style.display = isSignUp ? 'block' : 'none';
    }

    async function handleAuth() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const nickname = document.getElementById('nickname').value;

      const endpoint = isSignUp ? '/signup' : '/login';
      const bodyData = isSignUp ? { email, password, nickname } : { email, password };

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(bodyData)
        });
        const result = await response.json();

        if (response.ok) {
          currentUser = result.user;
          document.getElementById('auth-container').style.display = 'none';
          document.getElementById('app-container').style.display = 'block';
          
          document.getElementById('current-user-name').innerText = currentUser.nickname;
          document.getElementById('current-user-avatar').innerText = currentUser.nickname[0].toUpperCase();

          socket.emit('join channel', currentChannel);
        } else {
          alert(result.message || '인증 실패');
        }
      } catch (err) {
        console.error(err);
        alert('서버 통신 오류');
      }
    }

    function handleLogout() {
      currentUser = null;
      document.getElementById('app-container').style.display = 'none';
      document.getElementById('auth-container').style.display = 'flex';
    }

    function switchChannel(channel) {
      currentChannel = channel;
      document.getElementById('current-channel-title').innerText = `# ${channel}`;
      document.getElementById('message-input').placeholder = `#${channel}에 메시지 보내기`;
      
      document.querySelectorAll('.channel-item').forEach(item => item.classList.remove('active'));
      event.currentTarget.classList.add('active');

      document.getElementById('messages').innerHTML = '';
      socket.emit('join channel', channel);
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text || !currentUser) return;

      const now = new Date();
      const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

      const messageData = {
        channel: currentChannel,
        uid: currentUser.uid,
        nickname: currentUser.nickname,
        text: text,
        date: now.toLocaleDateString(),
        time: timeStr
      };

      socket.emit('chat message', messageData);
      input.value = '';
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    }

    socket.addEventListener('chat history', (data) => {
      const messages = document.getElementById('messages');
      messages.innerHTML = '';
      data.history.forEach(msg => appendMessage(msg));
    });

    socket.addEventListener('chat message', (msg) => {
      appendMessage(msg);
    });

    function appendMessage(msg) {
      const messages = document.getElementById('messages');
      const isMine = currentUser && msg.uid === currentUser.uid;

      const rows = messages.getElementsByClassName('message-row');
      let isConsecutive = false;
      let lastTimeElem = null;

      if (rows.length > 0) {
        const lastRow = rows[rows.length - 1];
        const lastNickname = lastRow.getAttribute('data-uid');
        if (lastNickname === msg.uid) {
          isConsecutive = true;
          lastTimeElem = lastRow.querySelector('.timestamp');
        }
      }

      const row = document.createElement('div');
      row.className = `message-row ${isMine ? 'mine' : ''}`;
      row.setAttribute('data-uid', msg.uid);

      if (!isConsecutive) {
        const avatar = document.createElement('div');
        avatar.className = 'message-avatar';
        if (msg.nickname) {
          avatar.innerText = msg.nickname[0].toUpperCase();
        } else {
          avatar.innerText = '유';
        }
        row.appendChild(avatar);
      }

      const timeContainer = document.createElement('div');
      timeContainer.className = 'time-container';

      const content = document.createElement('div');
      content.className = 'message-content';

      if (!isMine && !isConsecutive) {
        const header = document.createElement('div');
        header.className = 'message-header';
        header.innerText = msg.nickname;
        content.appendChild(header);
      }

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.innerText = msg.text;
      content.appendChild(bubble);

      const timeDiv = document.createElement('div');
      timeDiv.className = 'timestamp';
      timeDiv.innerText = msg.time;

      if (isConsecutive && lastTimeElem) {
        lastTimeElem.style.display = 'none';
      }
      
      if (isMine) {
        timeContainer.appendChild(timeDiv);
        timeContainer.appendChild(content);
      } else {
        timeContainer.appendChild(content);
        timeContainer.appendChild(timeDiv);
      }

      row.appendChild(timeContainer);
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
    }

    // 사이드바 리사이즈 드래그 로직 (6.4 : 30 비율 기반 초기 설정 및 자유 조절)
    const sidebar = document.getElementById('sidebar');
    const resizer = document.getElementById('sidebar-resizer');

    let isResizing = false;

    resizer.addEventListener('mousedown', (e) => {
      isResizing = true;
      resizer.classList.add('resizing');
      document.body.style.cursor = 'ew-resize';
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      
      let newWidth = e.clientX;
      if (newWidth < 180) newWidth = 180;
      if (newWidth > 450) newWidth = 450;

      sidebar.style.width = newWidth + 'px';
      sidebar.style.flex = 'none';
    });

    document.addEventListener('mouseup', () => {
      if (isResizing) {
        isResizing = false;
        resizer.classList.remove('resizing');
        document.body.style.cursor = 'default';
      }
    });
  </script>
</body>
</html>
