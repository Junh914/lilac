<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; height: 100vh;
      background-color: #313338; color: #dbdee1;
      font-family: 'Noto Sans KR', sans-serif, system-ui;
      display: flex; justify-content: center; align-items: center;
      user-select: none;
      overflow: hidden;
    }

    ::-webkit-scrollbar { width: 9.5px; height: 9.5px; }
    ::-webkit-scrollbar-track { background: #2b2d31; border-radius: 5px; }
    ::-webkit-scrollbar-thumb { background: #80848e; border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: #b5bac1; }

    #auth-container {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; height: 100vh; background-color: #313338;
      position: absolute; top: 0; left: 0; z-index: 10;
    }
    .auth-box {
      background-color: #2b2d31; padding: 30px; border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3); width: 350px; display: flex; flex-direction: column;
    }
    .auth-box h2 { color: #f2f3f5; margin-top: 0; text-align: center; }
    .auth-box input {
      background-color: #1e1f22; border: none; border-radius: 4px;
      padding: 10px; color: #dbdee1; font-size: 14px; margin-bottom: 15px; outline: none;
    }
    .auth-box button {
      background-color: #5865f2; color: white; border: none; border-radius: 4px;
      padding: 10px; font-size: 14px; font-weight: bold; cursor: pointer;
    }
    .auth-box button:hover { background-color: #4752c4; }

    /* 메인 앱 레이아웃 */
    #app-container {
      display: none; width: 100vw; height: 100vh; background-color: #313338;
      flex-direction: row; overflow: hidden;
    }

    /* 좌측 사이드바 */
    .sidebar-left {
      width: 240px; background-color: #2b2d31; display: flex; flex-direction: column; flex-shrink: 0;
    }

    /* 메인 채팅 영역 */
    .main-chat {
      flex: 1; display: flex; flex-direction: column; background-color: #313338; min-width: 0;
      position: relative;
    }

    /* 헤더 및 토글 버튼 */
    .chat-header {
      height: 48px; border-bottom: 1px solid #1f2023; display: flex; align-items: center;
      justify-content: space-between; padding: 0 16px; font-weight: bold; color: #f2f3f5;
    }
    .chat-header-right { display: flex; align-items: center; }
    .toggle-sidebar-btn {
      background: none; border: none; color: #b5bac1; cursor: pointer; font-size: 16px;
      padding: 6px; border-radius: 4px; display: flex; align-items: center; justify-content: center;
    }
    .toggle-sidebar-btn:hover { background-color: #35373c; color: #dbdee1; }

    .chat-messages {
      flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 4px;
    }

    .message-row { display: flex; gap: 16px; width: 100%; margin-top: 12px; position: relative; }
    .message-row.mine { flex-direction: row-reverse; }
    .message-row.consecutive { margin-top: 2px; }

    .avatar {
      width: 40px; height: 40px; border-radius: 50%; background-color: #5865f2;
      display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; flex-shrink: 0;
    }

    .time-container { display: flex; flex-direction: column; max-width: 70%; position: relative; }
    .message-header { font-size: 14px; margin-bottom: 4px; display: flex; gap: 8px; align-items: baseline; }
    .message-header span { color: #f2f3f5; font-weight: 500; }
    .timestamp { font-size: 10px; color: #949ba4; margin-top: 2px; }

    .message-bubble {
      background-color: #383a40; padding: 8px 12px; border-radius: 8px; word-break: break-all;
      color: #dbdee1; font-size: 14px; line-height: 1.4;
    }
    .mine .message-bubble { background-color: #5865f2; color: white; cursor: context-menu; }
    
    /* 답장 표시 UI */
    .reply-badge {
      font-size: 12px; color: #b5bac1; margin-bottom: 4px; display: flex; align-items: center; gap: 4px;
    }
    .reply-badge::before { content: '┌'; color: #4e5058; font-weight: bold; margin-right: 4px; }

    /* 호버 시 나타나는 액션 버튼 */
    .message-actions {
      display: none; position: absolute; top: -15px; right: 0;
      background-color: #2b2d31; border: 1px solid #1f2023; border-radius: 4px;
      padding: 2px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); z-index: 5;
    }
    .message-row.mine .message-actions { right: auto; left: 0; }
    .message-row:hover .message-actions { display: flex; }
    .action-btn {
      background: none; border: none; color: #b5bac1; cursor: pointer;
      padding: 4px 8px; border-radius: 4px; display: flex; align-items: center; justify-content: center;
    }
    .action-btn:hover { background-color: #404249; color: #dbdee1; }

    /* 답장 중인 상태 표시창 */
    #replying-bar {
      display: none; padding: 6px 12px; background-color: #2b2d31; color: #b5bac1;
      font-size: 12px; border-top-left-radius: 8px; border-top-right-radius: 8px;
      justify-content: space-between; align-items: center; margin: 0 16px;
    }
    #cancel-reply { cursor: pointer; color: #dbdee1; font-weight: bold; }

    /* 채팅 입력 영역 (단일 input) */
    .chat-input-area { padding: 0 16px 24px 16px; display: flex; flex-direction: column; }
    .chat-input-wrapper {
      background-color: #383a40; border-radius: 8px; padding: 10px 16px;
      display: flex; align-items: center;
    }
    .reply-active .chat-input-wrapper { border-top-left-radius: 0; border-top-right-radius: 0; }
    
    .chat-input-wrapper input {
      flex: 1; background: none; border: none; color: #dbdee1; font-size: 14px; outline: none;
    }

    /* 우측 사이드바 & 크기 조절 (Resizer) */
    .resizer {
      width: 5px; background-color: transparent; cursor: ew-resize; flex-shrink: 0;
      transition: background-color 0.2s; z-index: 5;
    }
    .resizer:hover, .resizer.dragging { background-color: #5865f2; }

    .sidebar-right {
      width: 240px; min-width: 150px; max-width: 500px;
      background-color: #2b2d31; display: flex; flex-direction: column; flex-shrink: 0;
      padding: 16px; overflow-y: auto;
    }
    .user-list-title { font-size: 12px; font-weight: bold; color: #949ba4; margin-bottom: 8px; }
    .user-item { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 4px; cursor: pointer; }
    .user-item:hover { background-color: #35373c; }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; background-color: #4e5058; display: flex; align-items: center; justify-content: center; font-size: 12px; color: white; }
    .user-name { font-size: 14px; color: #dbdee1; }

    /* 커스텀 우클릭 메뉴 */
    #context-menu {
      display: none; position: fixed; z-index: 1000; background-color: #111214;
      border-radius: 4px; padding: 6px 0; min-width: 160px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.4);
    }
    .context-menu-item { padding: 8px 12px; color: #b5bac1; font-size: 14px; cursor: pointer; transition: 0.1s; }
    .context-menu-item:hover { background-color: #5865f2; color: white; }
    .context-menu-item.danger:hover { background-color: #da373c; }
  </style>
</head>
<body>

  <!-- 우클릭 팝업 메뉴 -->
  <div id="context-menu">
    <div class="context-menu-item" id="menu-edit">메시지 수정</div>
    <div class="context-menu-item danger" id="menu-delete">메시지 삭제</div>
  </div>

  <!-- 로그인 화면 -->
  <div id="auth-container">
    <div class="auth-box">
      <h2>채팅방 입장</h2>
      <input type="text" id="nickname-input" placeholder="사용할 닉네임을 입력하세요">
      <button id="join-btn">입장하기</button>
    </div>
  </div>

  <!-- 메인 채팅 화면 -->
  <div id="app-container">
    <div class="sidebar-left">
      <div style="padding: 16px; font-weight: bold; color: white; border-bottom: 1px solid #1f2023;">서버 목록</div>
    </div>

    <div class="main-chat">
      <div class="chat-header">
        <span># 자유-채팅방</span>
        <div class="chat-header-right">
          <button class="toggle-sidebar-btn" id="toggle-sidebar" title="참여자 목록 접기/열기">👥</button>
        </div>
      </div>
      <div class="chat-messages" id="messages"></div>
      
      <div class="chat-input-area" id="input-area">
        <div id="replying-bar">
          <span id="replying-to-text"></span>
          <span id="cancel-reply">✕</span>
        </div>
        <div class="chat-input-wrapper">
          <input type="text" id="message-input" placeholder="#자유-채팅방에 메시지 보내기">
        </div>
      </div>
    </div>

    <div class="resizer" id="drag-resizer"></div>

    <div class="sidebar-right" id="sidebar-right">
      <div class="user-list-title">온라인 — 1</div>
      <div class="user-item">
        <div class="user-avatar" id="my-profile-icon">유</div>
        <div class="user-name" id="my-profile-name">사용자</div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const authContainer = document.getElementById('auth-container');
    const appContainer = document.getElementById('app-container');
    const nicknameInput = document.getElementById('nickname-input');
    const joinBtn = document.getElementById('join-btn');
    const messageInput = document.getElementById('message-input');
    const messages = document.getElementById('messages');
    
    const replyingBar = document.getElementById('replying-bar');
    const replyingToText = document.getElementById('replying-to-text');
    const cancelReplyBtn = document.getElementById('cancel-reply');
    const inputArea = document.getElementById('input-area');
    
    const resizer = document.getElementById('drag-resizer');
    const sidebarRight = document.getElementById('sidebar-right');
    const toggleSidebarBtn = document.getElementById('toggle-sidebar');

    let myNickname = '';
    let lastSenderId = null;
    let lastMinuteStr = null;
    let lastTimeElem = null;
    let currentReplyTarget = null;
    let contextTargetMessage = null;

    // --- 타이틀 알림 기능 ---
    let unreadCount = 0;
    let isWindowFocused = true;

    window.addEventListener('focus', () => {
      isWindowFocused = true;
      unreadCount = 0;
      document.title = 'Chat';
    });
    window.addEventListener('blur', () => {
      isWindowFocused = false;
    });

    // --- 로그인 로직 ---
    joinBtn.addEventListener('click', () => {
      const name = nicknameInput.value.trim();
      if (!name) return alert('닉네임을 입력해주세요!');
      myNickname = name;
      
      document.getElementById('my-profile-name').innerText = myNickname;
      document.getElementById('my-profile-icon').innerText = myNickname[0].toUpperCase();

      authContainer.style.display = 'none';
      appContainer.style.display = 'flex';
      socket.emit('join', myNickname);
      messageInput.focus();
    });

    // --- 사이드바 접기/열기 (Toggle) ---
    toggleSidebarBtn.addEventListener('click', () => {
      if (sidebarRight.style.display === 'none') {
        sidebarRight.style.display = 'flex';
        resizer.style.display = 'block';
      } else {
        sidebarRight.style.display = 'none';
        resizer.style.display = 'none';
      }
    });

    // --- 엔터 키 메시지 전송 로직 ---
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && messageInput.value.trim() !== '') {
        const text = messageInput.value.trim();
        const now = new Date();
        const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        
        socket.emit('chat message', { 
          id: 'msg-' + Date.now(), 
          text: text, 
          nickname: myNickname, 
          uid: socket.id, 
          time: timeStr,
          replyTo: currentReplyTarget 
        });
        
        messageInput.value = '';
        cancelReply(); 
      }
    });

    // --- 메시지 렌더링 로직 ---
    socket.addEventListener('chat message', (msg) => {
      const isMine = msg.nickname === myNickname;
      const isConsecutive = (msg.uid === lastSenderId && msg.time === lastMinuteStr && !msg.replyTo);

      if (!isMine && !isWindowFocused) {
        unreadCount++;
        document.title = `(${unreadCount}) Chat`;
      }

      const row = document.createElement('div');
      row.className = `message-row ${isMine ? 'mine' : ''} ${isConsecutive ? 'consecutive' : ''}`;
      row.id = msg.id; 

      if (!isMine) {
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        if (!isConsecutive) {
          avatar.innerText = (msg.nickname ? msg.nickname[0] : '유').toUpperCase();
        } else {
          avatar.style.visibility = 'hidden';
        }
        row.appendChild(avatar);
      }

      const timeContainer = document.createElement('div');
      timeContainer.className = 'time-container';

      const content = document.createElement('div');
      content.className = 'message-content';

      if (!isMine && !isConsecutive) {
        const header = document.createElement('div');
        header.className = 'message-header';
        header.innerHTML = `<span>${msg.nickname}</span>`;
        content.appendChild(header);
      }

      if (msg.replyTo) {
        const replyBadge = document.createElement('div');
        replyBadge.className = 'reply-badge';
        replyBadge.innerText = `${msg.replyTo}님에게 답장`;
        content.appendChild(replyBadge);
      }

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.innerText = msg.text;
      content.appendChild(bubble);

      const timeDiv = document.createElement('div');
      timeDiv.className = 'timestamp';
      timeDiv.innerText = msg.time;

      if (isConsecutive && lastTimeElem) lastTimeElem.style.display = 'none';

      if (isMine) {
        timeContainer.appendChild(timeDiv);
        timeContainer.appendChild(content);
      } else {
        timeContainer.appendChild(content);
        timeContainer.appendChild(timeDiv);
      }

      const actions = document.createElement('div');
      actions.className = 'message-actions';
      const replyBtn = document.createElement('button');
      replyBtn.className = 'action-btn';
      replyBtn.innerHTML = '↪️';
      replyBtn.title = "답장";
      replyBtn.onclick = () => setReplyTarget(msg.nickname);
      actions.appendChild(replyBtn);

      timeContainer.appendChild(actions);
      row.appendChild(timeContainer);
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;

      lastTimeElem = timeDiv;
      lastSenderId = msg.uid;
      lastMinuteStr = msg.time;
    });

    // --- 답장 기능 함수 ---
    function setReplyTarget(targetNickname) {
      currentReplyTarget = targetNickname;
      replyingToText.innerHTML = `<strong>${targetNickname}</strong>님에게 답장하는 중`;
      replyingBar.style.display = 'flex';
      inputArea.classList.add('reply-active');
      messageInput.focus();
    }
    
    function cancelReply() {
      currentReplyTarget = null;
      replyingBar.style.display = 'none';
      inputArea.classList.remove('reply-active');
    }
    cancelReplyBtn.addEventListener('click', cancelReply);

    // --- 우클릭 메뉴 (수정/삭제) ---
    const contextMenu = document.getElementById('context-menu');
    document.addEventListener('contextmenu', (e) => {
      const bubble = e.target.closest('.mine .message-bubble');
      if (bubble) {
        e.preventDefault();
        contextTargetMessage = bubble.closest('.message-row'); 
        contextMenu.style.display = 'block';
        contextMenu.style.left = `${e.pageX}px`;
        contextMenu.style.top = `${e.pageY}px`;
      } else {
        contextMenu.style.display = 'none';
      }
    });

    document.addEventListener('click', () => { contextMenu.style.display = 'none'; });

    document.getElementById('menu-edit').addEventListener('click', () => {
      if (!contextTargetMessage) return;
      const bubble = contextTargetMessage.querySelector('.message-bubble');
      const newText = prompt("메시지 수정:", bubble.innerText);
      if (newText !== null && newText.trim() !== '') {
        bubble.innerText = newText.trim();
      }
    });

    document.getElementById('menu-delete').addEventListener('click', () => {
      if (!contextTargetMessage) return;
      if (confirm("정말로 이 메시지를 삭제하시겠습니까?")) {
        contextTargetMessage.remove();
      }
    });

    // --- 사이드바 크기 조절 (Resizer) ---
    let isDragging = false;
    resizer.addEventListener('mousedown', () => {
      isDragging = true;
      resizer.classList.add('dragging');
      document.body.style.cursor = 'ew-resize';
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const newWidth = window.innerWidth - e.clientX - resizer.offsetWidth;
      if (newWidth >= 150 && newWidth <= 500) {
        sidebarRight.style.width = newWidth + 'px';
      }
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        resizer.classList.remove('dragging');
        document.body.style.cursor = 'default';
      }
    });
  </script>
</body>
</html>
