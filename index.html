<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  
  <script src="/socket.io/socket.io.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', sans-serif;
    }

    body {
      background-color: #313338;
      color: #dbdee1;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* --- 로그인 / 회원가입 화면 --- */
    #auth-container {
      background-color: #2b2d31;
      padding: 32px;
      border-radius: 8px;
      width: 400px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    #auth-container h2 {
      color: #f2f3f5;
      margin-bottom: 20px;
      text-align: center;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      color: #b5bac1;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      border-radius: 4px;
      border: none;
      background-color: #1e1f22;
      color: #f2f3f5;
      font-size: 14px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 4px;
      background-color: #5865f2;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #4752c4;
    }

    .toggle-text {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: #949ba4;
    }

    .toggle-text span {
      color: #00a8fc;
      cursor: pointer;
      text-decoration: underline;
    }

    /* --- 메인 채팅 화면 (디스코드 스타일) --- */
    #chat-container {
      display: none; /* 로그인 전에는 숨김 */
      width: 100%;
      height: 100vh;
      flex-direction: column;
      background-color: #313338;
    }

    /* 상단 헤더 */
    .chat-header {
      height: 48px;
      background-color: #2b2d31;
      border-bottom: 2px solid #1e1f22;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      color: #f2f3f5;
      font-weight: bold;
    }

    .user-info {
      font-size: 14px;
      color: #b5bac1;
    }

    .logout-btn {
      background-color: #da373c;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }

    /* 채팅 메시지 목록 영역 */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 메시지 아이템 (닉네임 + 시각 + 내용) */
    .message-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: #5865f2;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      flex-shrink: 0;
    }

    .message-content {
      display: flex;
      flex-direction: column;
    }

    .message-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }

    .nickname {
      color: #f2f3f5;
      font-weight: 600;
      font-size: 15px;
    }

    .timestamp {
      color: #949ba4;
      font-size: 12px;
    }

    .text {
      color: #dbdee1;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-all;
    }

    /* 입력창 영역 */
    .input-container {
      padding: 0 16px 24px 16px;
      background-color: #313338;
    }

    #chat-form {
      display: flex;
      background-color: #383a40;
      border-radius: 8px;
      padding: 0 16px;
      align-items: center;
    }

    #chat-input {
      flex: 1;
      padding: 12px 0;
      border: none;
      background: transparent;
      color: #f2f3f5;
      font-size: 14px;
      outline: none;
    }

    #send-btn {
      background: none;
      border: none;
      color: #5865f2;
      font-weight: bold;
      cursor: pointer;
      padding-left: 12px;
    }
  </style>
</head>
<body>

  <div id="auth-container">
    <h2 id="auth-title">로그인</h2>
    
    <div class="input-group" id="nickname-group" style="display: none;">
      <label>닉네임</label>
      <input type="text" id="nickname-input" placeholder="사용할 닉네임을 입력하세요">
    </div>

    <div class="input-group">
      <label>이메일</label>
      <input type="email" id="email-input" placeholder="name@example.com">
    </div>

    <div class="input-group">
      <label>비밀번호</label>
      <input type="password" id="password-input" placeholder="비밀번호 (6자리 이상)">
    </div>

    <button class="btn" id="auth-btn">로그인</button>

    <div class="toggle-text">
      <span id="toggle-auth">계정이 없으신가요? 회원가입</span>
    </div>
  </div>

  <div id="chat-container">
    <div class="chat-header">
      <div># 일반 채팅방</div>
      <div>
        <span class="user-info" id="current-user-info"></span>
        <button class="logout-btn" id="logout-btn">로그아웃</button>
      </div>
    </div>

    <div id="messages"></div>

    <div class="input-container">
      <form id="chat-form">
        <input type="text" id="chat-input" placeholder="메시지를 입력하세요..." autocomplete="off">
        <button type="submit" id="send-btn">전송</button>
      </form>
    </div>
  </div>

  <script>
    const firebaseConfig = {
  apiKey: "AIzaSyDRGQYScMifqnzBGvN8UfVx_mmHJL4MhPg",
  authDomain: "lilac-13935.firebaseapp.com",
  projectId: "lilac-13935",
  storageBucket: "lilac-13935.firebasestorage.app",
  messagingSenderId: "485552650048",
  appId: "1:485552650048:web:d05c5dd6ce989765a5aca5",
  measurementId: "G-81H89P6F6E"
};

    // Firebase 초기화
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const socket = io();

    // DOM 요소 가져오기
    const authContainer = document.getElementById('auth-container');
    const chatContainer = document.getElementById('chat-container');
    const authTitle = document.getElementById('auth-title');
    const nicknameGroup = document.getElementById('nickname-group');
    const nicknameInput = document.getElementById('nickname-input');
    const emailInput = document.getElementById('email-input');
    const passwordInput = document.getElementById('password-input');
    const authBtn = document.getElementById('auth-btn');
    const toggleAuth = document.getElementById('toggle-auth');
    const currentUserInfo = document.getElementById('current-user-info');
    const logoutBtn = document.getElementById('logout-btn');

    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const messages = document.getElementById('messages');

    let isSignUpMode = false; // 현재 모드 (false: 로그인, true: 회원가입)
    let currentUserNickname = "";

    // 2. 로그인/회원가입 모드 전환 토글
    toggleAuth.addEventListener('click', () => {
      isSignUpMode = !isSignUpMode;
      if (isSignUpMode) {
        authTitle.innerText = '회원가입';
        nicknameGroup.style.display = 'block';
        authBtn.innerText = '회원가입 완료';
        toggleAuth.innerText = '이미 계정이 있으신가요? 로그인';
      } else {
        authTitle.innerText = '로그인';
        nicknameGroup.style.display = 'none';
        authBtn.innerText = '로그인';
        toggleAuth.innerText = '계정이 없으신가요? 회원가입';
      }
    });

    // 3. 회원가입 및 로그인 버튼 클릭
    authBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();
      const nickname = nicknameInput.value.trim();

      if (!email || !password) {
        alert('이메일과 비밀번호를 입력해 주세요.');
        return;
      }

      try {
        if (isSignUpMode) {
          if (!nickname) {
            alert('닉네임을 입력해 주세요.');
            return;
          }
          // 회원가입
          const userCredential = await auth.createUserWithEmailAndPassword(email, password);
          // 닉네임(displayName) 저장
          await userCredential.user.updateProfile({ displayName: nickname });
          alert('회원가입 성공! 반갑습니다.');
        } else {
          // 로그인
          await auth.signInWithEmailAndPassword(email, password);
        }
      } catch (error) {
        alert('오류 발생: ' + error.message);
      }
    });

    // 4. 로그인 상태 감지 (Firebase Auth)
    auth.onAuthStateChanged((user) => {
      if (user) {
        // 로그인 성공 시
        currentUserNickname = user.displayName || '익명';
        currentUserInfo.innerText = `${currentUserNickname}님 환영합니다!`;
        
        authContainer.style.display = 'none';
        chatContainer.style.display = 'flex';
      } else {
        // 로그아웃 상태 시
        authContainer.style.display = 'block';
        chatContainer.style.display = 'none';
      }
    });

    // 5. 로그아웃
    logoutBtn.addEventListener('click', () => {
      auth.signOut();
    });

    // 6. 현재 시간 포맷 함수 (예: 오전 10:24)
    function getCurrentTime() {
      const now = new Date();
      return now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    }

    // 7. 채팅 메시지 전송
    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const msg = chatInput.value.trim();
      
      if (msg && currentUserNickname) {
        // 서버로 닉네임, 메시지, 시간 전송
        socket.emit('chat message', {
          nickname: currentUserNickname,
          text: msg,
          time: getCurrentTime()
        });
        chatInput.value = '';
      }
    });

    // 8. 서버로부터 메시지 수신 후 화면에 뿌리기
    socket.on('chat message', (data) => {
      const item = document.createElement('div');
      item.className = 'message-item';

      // 아바타 첫 글자
      const initial = data.nickname ? data.nickname.charAt(0) : '?';

      item.innerHTML = `
        <div class="avatar">${initial}</div>
        <div class="message-content">
          <div class="message-header">
            <span class="nickname">${data.nickname}</span>
            <span class="timestamp">${data.time}</span>
          </div>
          <div class="text">${data.text}</div>
        </div>
      `;

      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight; // 자동 스크롤 하단 이동
    });
  </script>
</body>
</html>
