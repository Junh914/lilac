<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; height: 100vh;
      background-color: #313338; color: #dbdee1;
      font-family: 'Noto Sans KR', sans-serif, system-ui;
      display: flex; justify-content: center; align-items: center;
      user-select: none;
      overflow: hidden;
    }

    ::-webkit-scrollbar { width: 9.5px; height: 9.5px; }
    ::-webkit-scrollbar-track { background: #2b2d31; border-radius: 5px; }
    ::-webkit-scrollbar-thumb { background: #80848e; border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: #b5bac1; }

    /* 로그인 화면 */
    #auth-container {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #2b2d31; padding: 40px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      width: 400px;
    }
    #auth-container h2 { color: #f2f3f5; margin-bottom: 24px; }
    #auth-container input {
      width: 100%; padding: 12px; background: #1e1f22; border: 1px solid #111214;
      border-radius: 4px; color: #dbdee1; font-size: 16px; margin-bottom: 16px; outline: none;
    }
    #auth-container button {
      width: 100%; padding: 12px; background: #5865f2; color: white; border: none;
      border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer;
    }
    #auth-container button:hover { background: #4752c4; }

    /* 메인 채팅창 레이아웃 */
    #chat-container {
      display: none; width: 100vw; height: 100vh; background: #313338;
      display: flex; flex-direction: column;
    }
    #messages {
      flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 4px;
    }

    /* 메시지 행 기본 스타일 */
    .message-row {
      display: flex; align-items: flex-start; gap: 12px; margin-top: 8px; width: 100%; position: relative;
    }
    
    /* 1 & 2. 자신이 보낸 메시지는 항상 우측 정렬 */
    .message-row.mine {
      flex-direction: row-reverse;
      justify-content: flex-start;
      align-self: flex-end;
    }

    .message-row.mine .message-content {
      align-items: flex-end;
      text-align: right;
    }

    /* 내가 보낸 메시지 안의 답장 미리보기 우측 정렬 */
    .message-row.mine .message-reply-preview,
    .message-row.mine .reply-reference {
      margin-left: auto;
      margin-right: 0;
      align-self: flex-end;
    }

    .avatar {
      width: 40px; height: 40px; border-radius: 50%; background: #5865f2;
      display: flex; align-items: center; justify-content: center; color: white; font-weight: bold;
      flex-shrink: 0;
    }
    .message-content { display: flex; flex-direction: column; max-width: 70%; }
    .message-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
    .username { font-weight: 600; color: #f2f3f5; font-size: 15px; }
    
    /* 타임스탬프 */
    .timestamp { font-size: 11px; color: #949ba4; margin-left: 4px; margin-right: 4px; align-self: flex-end; padding-bottom: 3px; }

    /* 1/4 화면 크기 말풍선 및 줄바꿈 */
    .message-bubble {
      background: #2b2d31; padding: 8px 12px; border-radius: 8px; color: #dbdee1;
      word-break: break-all; white-space: pre-wrap;
      max-width: 25vw !important; /* 화면 너비의 1/4 제한 */
      width: fit-content;
    }
    .message-row.mine .message-bubble {
      background: #2b5278; /* 본인 말풍선 색상 (기존 유지) */
    }

    /* 답장 미리보기 박스 */
    .message-reply-preview {
      font-size: 12px; color: #b5bac1; background: rgba(0,0,0,0.2);
      padding: 4px 8px; border-radius: 4px; margin-bottom: 4px;
      border-left: 3px solid #5865f2; max-width: 100%;
    }

    /* 입력창 영역 */
    #form {
      padding: 20px; background: #313338; display: flex; flex-direction: column; gap: 8px;
    }
    .reply-bar {
      display: none; background: #2b2d31; padding: 8px 12px; border-radius: 4px;
      justify-content: space-between; align-items: center; font-size: 13px; color: #b5bac1;
    }
    .reply-bar button { background: none; border: none; color: #b5bac1; cursor: pointer; }
    
    #input-wrapper { display: flex; gap: 10px; background: #383a40; border-radius: 8px; padding: 10px; }
    #input {
      flex: 1; background: transparent; border: none; color: #dbdee1; font-size: 15px; outline: none; resize: none; max-height: 100px;
    }
    #send-btn {
      background: #5865f2; color: white; border: none; border-radius: 4px; padding: 0 16px; cursor: pointer; font-weight: bold;
    }
    #send-btn:hover { background: #4752c4; }

    /* 메시지 호버 액션 (삭제 등) */
    .message-hover-actions {
      display: none; position: absolute; right: 20px; top: -10px; background: #2b2d31; border: 1px solid #111214; border-radius: 4px;
    }
    .message-row:hover .message-hover-actions { display: flex; }
    .action-btn { background: none; border: none; color: #b5bac1; padding: 6px 10px; cursor: pointer; }
    .action-btn:hover { color: white; background: #35373c; }
  </style>
</head>
<body>

  <div id="auth-container">
    <h2>채팅 로그인</h2>
    <input type="text" id="username-input" placeholder="닉네임을 입력하세요" autofocus>
    <button id="login-btn">입장하기</button>
  </div>

  <div id="chat-container" style="display:none;">
    <div id="messages"></div>
    
    <div id="form">
      <div id="reply-bar" class="reply-bar">
        <span id="reply-target-text">답장 중...</span>
        <button id="cancel-reply-btn"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="input-wrapper">
        <textarea id="input" placeholder="메시지를 입력하세요..." rows="1"></textarea>
        <button id="send-btn">전송</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    let currentUser = null;
    let replyTarget = null;

    // 메시지 묶음 처리를 위한 변수
    let lastSenderId = null;
    let lastMinuteStr = null;
    let lastTimeElem = null;

    const authContainer = document.getElementById('auth-container');
    const chatContainer = document.getElementById('chat-container');
    const usernameInput = document.getElementById('username-input');
    const loginBtn = document.getElementById('login-btn');
    
    const messagesDiv = document.getElementById('messages');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');
    const replyBar = document.getElementById('reply-bar');
    const replyTargetText = document.getElementById('reply-target-text');
    const cancelReplyBtn = document.getElementById('cancel-reply-btn');

    // 로그인 처리
    loginBtn.addEventListener('click', () => {
      const username = usernameInput.value.trim();
      if (!username) return alert('닉네임을 입력해주세요.');
      
      currentUser = { id: socket.id || 'user_' + Date.now(), name: username };
      authContainer.style.display = 'none';
      chatContainer.style.display = 'flex';
      socket.emit('join', currentUser);
    });

    usernameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loginBtn.click();
    });

    // 답장 타겟 설정
    function setReplyTarget(msg) {
      replyTarget = msg;
      replyTargetText.innerText = `${msg.username}님의 메시지에 답장 중: "${msg.text}"`;
      replyBar.style.display = 'flex';
      input.focus();
    }

    cancelReplyBtn.addEventListener('click', () => {
      replyTarget = null;
      replyBar.style.display = 'none';
    });

    // 메시지 전송
    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      const now = new Date();
      const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

      const msgData = {
        uid: currentUser.id,
        username: currentUser.name,
        text: text,
        time: timeStr,
        replyTo: replyTarget ? { username: replyTarget.username, text: replyTarget.text } : null
      };

      socket.emit('chat message', msgData);
      input.value = '';
      replyTarget = null;
      replyBar.style.display = 'none';
    }

    // 소켓 메시지 수신 및 렌더링
    socket.on('chat message', (msg) => {
      const isMine = currentUser && msg.uid === currentUser.id;

      // 3. 메시지 묶음 처리 기준 (같은 유저, 같은 분, 답장이 아닐 때)
      const isConsecutive = (lastSenderId === msg.uid && lastMinuteStr === msg.time && !msg.replyTo);

      const row = document.createElement('div');
      row.className = 'message-row';
      if (isMine) row.classList.add('mine');

      // 연속 메시지가 아닐 때만 아바타와 헤더(닉네임) 표시
      if (!isConsecutive) {
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.innerText = msg.username.charAt(0).toUpperCase();
        row.appendChild(avatar);
      } else {
        // 묶인 메시지는 아바타 공간만큼 들여쓰기나 간격 조정용 빈 공간 추가 가능 (기존 스타일 유지)
        const spacer = document.createElement('div');
        spacer.style.width = '40px';
        spacer.style.flexShrink = '0';
        row.appendChild(spacer);
      }

      const content = document.createElement('div');
      content.className = 'message-content';

      if (!isConsecutive) {
        const header = document.createElement('div');
        header.className = 'message-header';
        header.innerHTML = `<span class="username">${msg.username}</span>`;
        content.appendChild(header);
      }

      // 답장 내용이 있는 경우 표시
      if (msg.replyTo) {
        const replyPreview = document.createElement('div');
        replyPreview.className = 'message-reply-preview';
        replyPreview.innerHTML = `<strong>${msg.replyTo.username}</strong>: ${msg.replyTo.text}`;
        content.appendChild(replyPreview);
      }

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      
      if (msg.isDeleted) {
        bubble.classList.add('deleted');
        bubble.innerHTML = `<span style="font-size:13px; opacity:0.7;">🚫</span> 삭제된 메시지입니다.`;
      } else {
        bubble.innerText = msg.text || '';
      }
      content.appendChild(bubble);
      row.appendChild(content);

      // 타임스탬프 생성 및 연속 시간 숨김 처리
      const timeDiv = document.createElement('div');
      timeDiv.className = 'timestamp';
      timeDiv.innerText = msg.time;

      if (isConsecutive && lastTimeElem) {
        lastTimeElem.style.display = 'none'; // 이전 메시지 시간 숨김
      }

      row.appendChild(timeDiv);

      // 삭제/호버 버튼 추가
      if (!msg.isDeleted) {
        const hoverActions = document.createElement('div');
        hoverActions.className = 'message-hover-actions';
        hoverActions.innerHTML = `<button class="action-btn hover-reply-btn" title="답장"><i class="fa-solid fa-reply"></i> 답장</button>`;
        hoverActions.querySelector('.hover-reply-btn').addEventListener('click', () => {
          setReplyTarget(msg);
        });
        row.appendChild(hoverActions);
      }

      messagesDiv.appendChild(row);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      // 다음 비교를 위해 변수 업데이트 (가장 아래쪽 메시지 기준)
      lastTimeElem = timeDiv;
      lastSenderId = msg.uid;
      lastMinuteStr = msg.time;
    });
  </script>
</body>
</html>
