<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; height: 100vh;
      background-color: #313338; color: #dbdee1;
      font-family: 'Noto Sans KR', sans-serif, system-ui;
      display: flex; justify-content: center; align-items: center;
      user-select: none;
      overflow: hidden;
    }

    ::-webkit-scrollbar { width: 9.5px; height: 9.5px; }
    ::-webkit-scrollbar-track { background: #2b2d31; border-radius: 5px; }
    ::-webkit-scrollbar-thumb { background: #80848e; border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: #b5bac1; }

    /* 로그인 화면 */
    #auth-container {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; height: 100vh; background-color: #313338;
      position: absolute; top: 0; left: 0; z-index: 10;
    }
    .auth-box {
      background-color: #2b2d31; padding: 32px; border-radius: 8px;
      width: 400px; display: flex; flex-direction: column; gap: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .auth-box h2 { color: #f2f3f5; margin: 0 0 8px 0; text-align: center; }
    .auth-input {
      background-color: #1e1f22; border: 1px solid #1e1f22; border-radius: 4px;
      padding: 10px 12px; color: #dbdee1; font-size: 14px; outline: none;
    }
    .auth-input:focus { border-color: #00a8fc; }
    .auth-btn {
      background-color: #5865f2; color: white; border: none; border-radius: 4px;
      padding: 10px; font-size: 16px; font-weight: 500; cursor: pointer;
      transition: background-color 0.2s;
    }
    .auth-btn:hover { background-color: #4752c4; }
    .auth-switch {
      text-align: center; font-size: 14px; color: #949ba4; cursor: pointer;
    }
    .auth-switch span { color: #00a8fc; text-decoration: underline; }

    /* 메인 앱 레이아웃 (사이드바 - 리사이저 - 채팅창) */
    #app-container {
      display: none; /* 로그인 전 숨김 */
      width: 100vw; height: 100vh;
      display: flex; flex-direction: row;
      overflow: hidden;
    }

    /* 사이드바 (기본 비율 6.4 : 30 중 6.4 영역) */
    #sidebar {
      background-color: #2b2d31;
      display: flex; flex-direction: column;
      flex-shrink: 0;
      min-width: 150px; max-width: 500px;
      position: relative;
    }
    .sidebar-header {
      padding: 16px; font-weight: bold; font-size: 16px; color: #f2f3f5;
      border-bottom: 1px solid #1f2023;
    }
    .channel-list {
      flex: 1; padding: 8px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px;
    }
    .channel-item {
      padding: 10px 12px; border-radius: 4px; cursor: pointer; color: #949ba4;
      font-weight: 500; transition: background 0.15s, color 0.15s;
    }
    .channel-item:hover { background-color: #35373c; color: #dbdee1; }
    .channel-item.active { background-color: #404249; color: #ffffff; }

    .user-profile {
      padding: 10px 12px; background-color: #232428; display: flex; align-items: center; justify-content: space-between;
    }
    .user-info { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #f2f3f5; }
    .logout-btn { background: none; border: none; color: #949ba4; cursor: pointer; font-size: 13px; }
    .logout-btn:hover { color: #f23f43; }

    /* 리사이저 바 */
    #sidebar-resizer {
      width: 5px;
      background-color: #1e1f22;
      cursor: col-resize;
      flex-shrink: 0;
      transition: background-color 0.2s;
    }
    #sidebar-resizer:hover, #sidebar-resizer.resizing {
      background-color: #5865f2;
    }

    /* 메인 채팅 영역 (기본 비율 6.4 : 30 중 30 영역) */
    #chat-container {
      flex: 1;
      background-color: #313338;
      display: flex; flex-direction: column;
      min-width: 300px;
      position: relative;
    }
    .chat-header {
      height: 48px; padding: 0 16px; display: flex; align-items: center;
      font-weight: bold; border-bottom: 1px solid #1f2023; font-size: 16px; color: #f2f3f5;
    }
    .chat-messages {
      flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;
    }
    
    /* 메시지 아이템 스타일 */
    .message-row { display: flex; gap: 16px; width: 100%; }
    .message-avatar { width: 40px; height: 40px; border-radius: 50%; background-color: #5865f2; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; flex-shrink: 0; }
    .message-content { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .message-header { display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .message-header .username { font-weight: 600; color: #f2f3f5; }
    .message-header .timestamp { font-size: 12px; color: #949ba4; }
    .message-bubble { font-size: 14px; color: #dbdee1; line-height: 1.4; word-break: break-all; }

    /* 입력창 영역 */
    .chat-input-area { padding: 0 16px 24px 16px; }
    .chat-input-wrapper {
      background-color: #383a40; border-radius: 8px; padding: 10px 16px;
      display: flex; align-items: center;
    }
    .chat-input {
      width: 100%; background: none; border: none; outline: none;
      color: #dbdee1; font-size: 14px; font-family: inherit;
    }
  </style>
</head>
<body>

  <div id="auth-container">
    <div class="auth-box">
      <h2 id="auth-title">로그인</h2>
      <input type="email" id="auth-email" class="auth-input" placeholder="이메일">
      <input type="password" id="auth-password" class="auth-input" placeholder="비밀번호">
      <button id="auth-action-btn" class="auth-btn">로그인</button>
      <div id="auth-switch-text" class="auth-switch">계정이 없으신가요? <span>회원가입하기</span></div>
    </div>
  </div>

  <div id="app-container" style="display: none;">
    <div id="sidebar">
      <div class="sidebar-header">채널 목록</div>
      <div class="channel-list" id="channel-list">
        <div class="channel-item active" data-channel="general"># general</div>
        <div class="channel-item" data-channel="random"># random</div>
      </div>
      <div class="user-profile">
        <div class="user-info" id="user-display-name">유저</div>
        <button class="logout-btn" id="logout-btn">로그아웃</button>
      </div>
    </div>

    <div id="sidebar-resizer"></div>

    <div id="chat-container">
      <div class="chat-header" id="current-channel-title"># general</div>
      <div class="chat-messages" id="messages"></div>
      <div class="chat-input-area">
        <div class="chat-input-wrapper">
          <input type="text" id="message-input" class="chat-input" placeholder="#general에 메시지 보내기">
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // 서버 DB / Firebase 인증 연동 설정 유지 (기존 프로젝트 설정값)
    // 환경에 맞춰 아래 firebaseConfig 값을 유지하거나 연동합니다.
    const firebaseConfig = {
  apiKey: "AIzaSyDRGQYScMifqnzBGvN8UfVx_mmHJL4MhPg",
  authDomain: "lilac-13935.firebaseapp.com",
  projectId: "lilac-13935",
  storageBucket: "lilac-13935.firebasestorage.app",
  messagingSenderId: "485552650048",
  appId: "1:485552650048:web:d05c5dd6ce989765a5aca5",
  measurementId: "G-81H89P6F6E"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const socket = io();

    let currentUser = null;
    let currentChannel = 'general';

    // 화면 초기 로드 시 6.4 : 30 너비 비율 적용 로직
    window.addEventListener('DOMContentLoaded', () => {
      const appContainer = document.getElementById('app-container');
      const sidebar = document.getElementById('sidebar');
      
      // 전체 너비 기준 6.4 : 30 비율 배분 (36.4 중 6.4 비율)
      const totalWidth = window.innerWidth;
      const initialSidebarWidth = totalWidth * (6.4 / 36.4);
      sidebar.style.width = Math.max(180, Math.min(initialSidebarWidth, 400)) + 'px';
    });

    // 사이드바 리사이저 드래그 이벤트 로직
    const resizer = document.getElementById('sidebar-resizer');
    const sidebar = document.getElementById('sidebar');
    let isResizing = false;

    resizer.addEventListener('mousedown', (e) => {
      isResizing = true;
      resizer.classList.add('resizing');
      document.body.style.cursor = 'col-resize';
      e.preventDefault();
    });

    document.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      let newWidth = e.clientX;
      if (newWidth < 150) newWidth = 150;
      if (newWidth > 500) newWidth = 500;
      sidebar.style.width = newWidth + 'px';
    });

    document.addEventListener('mouseup', () => {
      if (isResizing) {
        isResizing = false;
        resizer.classList.remove('resizing');
        document.body.style.cursor = 'default';
      }
    });

    // 인증 상태 관리 (기존 로그인 시스템 유지)
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('auth-container').style.display = 'none';
        document.getElementById('app-container').style.display = 'flex';
        document.getElementById('user-display-name').innerText = user.email.split('@')[0];
        
        // 채널 입장 요청
        socket.emit('join channel', currentChannel);
      } else {
        currentUser = null;
        document.getElementById('auth-container').style.display = 'flex';
        document.getElementById('app-container').style.display = 'none';
      }
    });

    // 로그인 / 회원가입 UI 토글 및 처리
    let isSignupMode = false;
    const authTitle = document.getElementById('auth-title');
    const authActionBtn = document.getElementById('auth-action-btn');
    const authSwitchText = document.getElementById('auth-switch-text');

    authSwitchText.addEventListener('click', () => {
      isSignupMode = !isSignupMode;
      authTitle.innerText = isSignupMode ? '회원가입' : '로그인';
      authActionBtn.innerText = isSignupMode ? '가입하기' : '로그인';
      authSwitchText.innerHTML = isSignupMode ? '이미 계정이 있으신가요? <span>로그인하기</span>' : '계정이 없으신가요? <span>회원가입하기</span>';
    });

    authActionBtn.addEventListener('click', async () => {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      try {
        if (isSignupMode) {
          await createUserWithEmailAndPassword(auth, email, password);
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
      } catch (error) {
        alert('인증 실패: ' + error.message);
      }
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      signOut(auth);
    });

    // 채널 변경 이벤트
    document.querySelectorAll('.channel-item').forEach(item => {
      item.addEventListener('click', (e) => {
        document.querySelectorAll('.channel-item').forEach(i => i.classList.remove('active'));
        e.target.classList.add('active');
        currentChannel = e.target.getAttribute('data-channel');
        document.getElementById('current-channel-title').innerText = `# ${currentChannel}`;
        document.getElementById('messages').innerHTML = '';
        socket.emit('join channel', currentChannel);
      });
    });

    // 소켓 채팅 내역 수신
    socket.on('chat history', (data) => {
      const messagesDiv = document.getElementById('messages');
      messagesDiv.innerHTML = '';
      data.history.forEach(msg => appendMessage(msg));
    });

    socket.on('chat message', (msg) => {
      if (msg.channel === currentChannel) {
        appendMessage(msg);
      }
    });

    // 메시지 전송
    const messageInput = document.getElementById('message-input');
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && messageInput.value.trim() !== '') {
        const text = messageInput.value;
        const now = new Date();
        const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
        
        socket.emit('chat message', {
          channel: currentChannel,
          uid: currentUser.uid,
          nickname: currentUser.email.split('@')[0],
          text: text,
          date: now.toLocaleDateString(),
          time: timeStr
        });
        messageInput.value = '';
      }
    });

    function appendMessage(msg) {
      const messagesDiv = document.getElementById('messages');
      const row = document.createElement('div');
      row.className = 'message-row';

      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.innerText = msg.nickname ? msg.nickname[0].toUpperCase() : 'U';
      row.appendChild(avatar);

      const content = document.createElement('div');
      content.className = 'message-content';

      const header = document.createElement('div');
      header.className = 'message-header';
      
      const username = document.createElement('span');
      username.className = 'username';
      username.innerText = msg.nickname;
      header.appendChild(username);

      const timestamp = document.createElement('span');
      timestamp.className = 'timestamp';
      timestamp.innerText = msg.time || '';
      header.appendChild(timestamp);

      content.appendChild(header);

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.innerText = msg.text;
      content.appendChild(bubble);

      row.appendChild(content);
      messagesDiv.appendChild(row);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
