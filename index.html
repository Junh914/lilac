<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미니 디스코드</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0; height: 100vh;
      background-color: #313338; color: #dbdee1;
      font-family: 'Noto Sans KR', sans-serif, system-ui;
      display: flex;
    }

    /* 닉네임 입력 모달창 스타일 */
    #login-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .login-box {
      background-color: #2b2d31; padding: 30px; border-radius: 8px; width: 350px; text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .login-box h2 { color: #fff; margin-bottom: 20px; font-size: 20px; }
    .login-box input {
      width: 100%; padding: 12px; background-color: #1e1f22; border: 1px solid #111;
      color: #fff; border-radius: 4px; margin-bottom: 15px; outline: none; font-size: 14px;
    }
    .login-box button {
      width: 100%; background-color: #5865f2; color: #fff; border: none; padding: 12px;
      border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 15px;
    }
    .login-box button:hover { background-color: #4752c4; }

    /* 좌측 사이드바 (채널 목록) */
    .sidebar {
      width: 240px; background-color: #2b2d31; display: flex; flex-direction: column;
      border-right: 1px solid #1f2023;
    }
    .server-header {
      padding: 20px; font-weight: bold; font-size: 16px; color: #fff;
      border-bottom: 1px solid #1f2023;
    }
    .channels {
      padding: 10px; flex: 1; overflow-y: auto;
    }
    .channel-item {
      padding: 10px; border-radius: 4px; cursor: pointer; margin-bottom: 4px; color: #949ba4; font-weight: 500;
    }
    .channel-item:hover, .channel-item.active {
      background-color: #35373c; color: #fff;
    }

    /* 우측 메인 채팅 영역 */
    .chat-container {
      flex: 1; display: flex; flex-direction: column; background-color: #313338;
    }
    .chat-header {
      padding: 20px; font-weight: bold; font-size: 16px; color: #fff;
      border-bottom: 1px solid #1f2023; background-color: #313338;
    }
    .messages {
      flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;
    }
    .message {
      display: flex; flex-direction: column;
    }
    .message-header {
      display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px;
    }
    .nickname { font-weight: bold; color: #fff; font-size: 15px; }
    .timestamp { font-size: 11px; color: #949ba4; }
    .message-text { color: #dbdee1; font-size: 14px; line-height: 1.4; word-break: break-all; }

    /* 입력창 영역 */
    .input-area {
      padding: 20px; background-color: #313338;
    }
    .input-wrapper {
      background-color: #383a40; border-radius: 8px; padding: 10px 15px; display: flex; gap: 10px; align-items: center;
    }
    input[type="text"] {
      flex: 1; background: transparent; border: none; color: #dbdee1; outline: none; font-size: 14px;
    }
    button.send-btn {
      background-color: #5865f2; color: #fff; border: none; padding: 8px 16px;
      border-radius: 4px; cursor: pointer; font-weight: bold;
    }
    button.send-btn:hover { background-color: #4752c4; }
  </style>
</head>
<body>

  <div id="login-modal">
    <div class="login-box">
      <h2>미니 디스코드 입장</h2>
      <input type="text" id="nickname-input" placeholder="사용할 닉네임을 입력하세요" autocomplete="off">
      <button id="login-btn">입장하기</button>
    </div>
  </div>

  <div class="sidebar">
    <div class="server-header">Lilac Server</div>
    <div class="channels">
      <div class="channel-item active" data-channel="general"># 일반-채팅</div>
      <div class="channel-item" data-channel="random"># 자유-공간</div>
      <div class="channel-item" data-channel="development"># 개발-이야기</div>
    </div>
  </div>

  <div class="chat-container">
    <div class="chat-header" id="current-channel-title"># 일반-채팅</div>
    <div class="messages" id="messages-container"></div>
    <div class="input-area">
      <form class="input-wrapper" id="message-form">
        <input type="text" id="message-input" placeholder="#일반-채팅 채널에 메시지 보내기" autocomplete="off">
        <button type="submit" class="send-btn">전송</button>
      </form>
    </div>
  </div>

  <script>
    const socket = io();
    let currentNickname = '';
    let currentChannel = 'general';

    const loginModal = document.getElementById('login-modal');
    const loginBtn = document.getElementById('login-btn');
    const nicknameInput = document.getElementById('nickname-input');
    const messageForm = document.getElementById('message-form');
    const messageInput = document.getElementById('message-input');
    const messagesContainer = document.getElementById('messages-container');
    const channelItems = document.querySelectorAll('.channel-item');
    const currentChannelTitle = document.getElementById('current-channel-title');

    // 닉네임 입력 후 입장
    loginBtn.addEventListener('click', () => {
      const val = nicknameInput.value.trim();
      if (!val) {
        alert('닉네임을 입력해주세요!');
        return;
      }
      currentNickname = val;
      loginModal.style.display = 'none';
      socket.emit('join channel', currentChannel);
    });

    nicknameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loginBtn.click();
    });

    // 채널 변경 클릭 이벤트
    channelItems.forEach(item => {
      item.addEventListener('click', () => {
        channelItems.forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        currentChannel = item.getAttribute('data-channel');
        currentChannelTitle.textContent = item.textContent;
        messagesContainer.innerHTML = ''; // 화면 초기화 후 해당 채널 내역 요청
        socket.emit('join channel', currentChannel);
        messageInput.placeholder = `${item.textContent} 채널에 메시지 보내기`;
      });
    });

    // 메시지 전송
    messageForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text || !currentNickname) return;

      socket.emit('chat message', {
        channel: currentChannel,
        nickname: currentNickname,
        text: text
      });

      messageInput.value = '';
    });

    // 데이터베이스에 저장된 채널별 과거 대화 내역 수신
    socket.on('chat history', (data) => {
      if (data.channel === currentChannel) {
        messagesContainer.innerHTML = '';
        data.history.forEach(msg => appendMessage(msg));
        scrollToBottom();
      }
    });

    // 실시간 새 메시지 수신
    socket.on('chat message', (msg) => {
      if (msg.channel === currentChannel) {
        appendMessage(msg);
        scrollToBottom();
      }
    });

    function appendMessage(msg) {
      const div = document.createElement('div');
      div.className = 'message';
      div.innerHTML = `
        <div class="message-header">
          <span class="nickname">${escapeHtml(msg.nickname)}</span>
          <span class="timestamp">${msg.time || ''}</span>
        </div>
        <div class="message-text">${escapeHtml(msg.text)}</div>
      `;
      messagesContainer.appendChild(div);
    }

    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
