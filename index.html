<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미니 디스코드 채팅</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      height: 100vh;
      margin: 0;
      background-color: #313338;
      color: #dbdee1;
      font-family: 'Noto Sans KR', sans-serif, system-ui;
    }

    /* 좌측 사이드바 (채널 목록 및 프로필) */
    #sidebar {
      width: 240px;
      background-color: #2b2d31;
      display: flex;
      flex-direction: column;
      padding: 15px 10px;
      flex-shrink: 0;
      border-right: 1px solid #1e1f22;
    }

    .sidebar-header {
      font-weight: bold;
      font-size: 1.1rem;
      padding-bottom: 15px;
      color: #f2f3f5;
      border-bottom: 1px solid #35363c;
      margin-bottom: 15px;
    }

    .channel-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .channel-item {
      padding: 10px 12px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 4px;
      color: #949ba4;
      font-weight: 500;
      transition: background-color 0.15s, color 0.15s;
    }

    .channel-item:hover {
      background-color: #35373c;
      color: #dbdee1;
    }

    .channel-item.active {
      background-color: #404249;
      color: #ffffff;
      font-weight: bold;
    }

    .user-profile {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid #35363c;
    }

    .user-profile label {
      font-size: 0.8rem;
      color: #949ba4;
      display: block;
      margin-bottom: 5px;
    }

    .user-profile input {
      width: 100%;
      padding: 8px;
      background-color: #1e1f22;
      border: 1px solid #383a40;
      border-radius: 4px;
      color: #f2f3f5;
      outline: none;
    }

    /* 우측 채팅 컨테이너 */
    #chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #313338;
      height: 100vh;
    }

    #chat-header {
      height: 48px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #1f2023;
      font-weight: bold;
      font-size: 1rem;
      color: #f2f3f5;
      background-color: #313338;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 메시지 풍선 및 스타일 */
    .message-item {
      display: flex;
      flex-direction: column;
      max-width: 80%;
      animation: fadeIn 0.15s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-item.others {
      align-self: flex-start;
    }

    .message-item.mine {
      align-self: flex-end;
    }

    .message-info {
      font-size: 0.8rem;
      color: #949ba4;
      margin-bottom: 4px;
      display: flex;
      gap: 8px;
      align-items: baseline;
    }

    .message-item.mine .message-info {
      justify-content: flex-end;
    }

    .message-nickname {
      font-weight: 600;
      color: #f2f3f5;
    }

    .message-time {
      font-size: 0.75rem;
      color: #80848e;
    }

    .message-content {
      background-color: #383a40;
      color: #dbdee1;
      padding: 10px 14px;
      border-radius: 8px;
      word-break: break-word;
      line-height: 1.4;
    }

    .message-item.mine .message-content {
      background-color: #5865f2;
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }

    .message-item.others .message-content {
      border-bottom-left-radius: 2px;
    }

    #message-form {
      padding: 15px 20px;
      background-color: #313338;
    }

    .input-wrapper {
      display: flex;
      background-color: #383a40;
      border-radius: 8px;
      padding: 0 10px;
      align-items: center;
    }

    #message-input {
      flex: 1;
      padding: 12px;
      background: transparent;
      border: none;
      color: #f2f3f5;
      font-size: 0.95rem;
      outline: none;
    }

    #send-btn {
      background-color: #5865f2;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    #send-btn:hover {
      background-color: #4752c4;
    }

    /* 🟢 스마트폰 최적화 미디어 쿼리 (화면 폭 768px 이하) */
    @media screen and (max-width: 768px) {
      body {
        flex-direction: column !important;
        height: 100vh;
        overflow: hidden;
      }

      #sidebar {
        width: 100% !important;
        height: auto !important;
        max-height: 120px;
        flex-direction: row !important;
        align-items: center;
        justify-content: space-between;
        padding: 10px;
        overflow-x: auto;
      }

      .sidebar-header {
        border-bottom: none;
        margin-bottom: 0;
        padding-bottom: 0;
        font-size: 0.9rem;
      }

      .channel-list {
        display: flex;
        gap: 8px;
      }

      .user-profile {
        margin-top: 0;
        border-top: none;
        padding-top: 0;
        width: 120px;
      }

      #chat-container {
        width: 100% !important;
        height: calc(100vh - 120px) !important;
        flex: 1;
      }

      #messages {
        padding: 12px;
      }
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="sidebar-header">💬 디스코드 서버</div>
    
    <ul class="channel-list">
      <li class="channel-item active" data-channel="general"># 일반-채팅</li>
      <li class="channel-item" data-channel="anonymous"># 완전-익명</li>
    </ul>

    <div class="user-profile">
      <label for="nickname-input">내 닉네임</label>
      <input type="text" id="nickname-input" value="유저1" placeholder="닉네임 입력">
    </div>
  </div>

  <div id="chat-container">
    <div id="chat-header"># 일반-채팅</div>

    <div id="messages"></div>

    <form id="message-form">
      <div class="input-wrapper">
        <input type="text" id="message-input" placeholder="메시지를 입력하세요..." autocomplete="off" required>
        <button type="submit" id="send-btn">전송</button>
      </div>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    let currentChannel = 'general';
    let mySocketId = null;

    const messages = document.getElementById('messages');
    const messageForm = document.getElementById('message-form');
    const messageInput = document.getElementById('message-input');
    const nicknameInput = document.getElementById('nickname-input');
    const chatHeader = document.getElementById('chat-header');
    const channelItems = document.querySelectorAll('.channel-item');

    // 접속 완료 시 소켓 고유 ID 기억
    socket.on('connect', () => {
      mySocketId = socket.id;
    });

    // 🟢 1. 과거 대화 내역 받기 (Firestore에서 로드)
    socket.on('chat history', (data) => {
      if (data.channel === currentChannel) {
        messages.innerHTML = ''; // 화면 비우기
        if (data.history && Array.isArray(data.history)) {
          data.history.forEach((msg) => {
            renderMessage(msg);
          });
        }
        scrollToBottom();
      }
    });

    // 🟢 2. 실시간 메시지 수신
    socket.on('chat message', (msg) => {
      if (msg.channel === currentChannel) {
        renderMessage(msg);
        scrollToBottom();
      }
    });

    // 화면에 메시지 말풍선 생성 함수
    function renderMessage(msg) {
      const msgDiv = document.createElement('div');
      
      // 내 메시지 여부 판별 (socketId가 같거나 닉네임이 같으면 내가 보낸 메시지)
      const isMine = msg.senderId ? (msg.senderId === mySocketId) : (msg.nickname === nicknameInput.value.trim());

      msgDiv.classList.add('message-item');
      msgDiv.classList.add(isMine ? 'mine' : 'others');

      // 익명 채널 전용 닉네임 표시 로직
      const displayNickname = (currentChannel === 'anonymous') ? (isMine ? '나 (익명)' : '익명') : (msg.nickname || '익명');

      msgDiv.innerHTML = `
        <div class="message-info">
          <span class="message-nickname">${escapeHtml(displayNickname)}</span>
          <span class="message-time">${msg.time || ''}</span>
        </div>
        <div class="message-content">${escapeHtml(msg.text)}</div>
      `;

      messages.appendChild(msgDiv);
    }

    // 보안을 위한 HTML 태그 변환 함수
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
    }

    function scrollToBottom() {
      messages.scrollTop = messages.scrollHeight;
    }

    // 메시지 전송 이벤트
    messageForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text) return;

      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const timeStr = `${hours}:${minutes}`;

      const msgData = {
        channel: currentChannel,
        nickname: nicknameInput.value.trim() || '익명',
        text: text,
        time: timeStr,
        fullDate: now.toLocaleDateString('ko-KR')
      };

      socket.emit('chat message', msgData);

      messageInput.value = '';
      messageInput.focus();
    });

    // 채널 클릭 이동 이벤트
    channelItems.forEach(item => {
      item.addEventListener('click', () => {
        const selectedChannel = item.getAttribute('data-channel');
        if (selectedChannel === currentChannel) return;

        channelItems.forEach(ch => ch.classList.remove('active'));
        item.classList.add('active');

        currentChannel = selectedChannel;
        chatHeader.textContent = item.textContent;

        messages.innerHTML = '';
        socket.emit('join channel', currentChannel);
      });
    });
  </script>
</body>
</html>
